<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Week Behind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* the week behind — engine. Nothing personal here: every word comes from DATA.
   be•do's now palette (plugins/bedo/assets/now-palette.css); day by default, night follows the phone. */
:root{ --ground:#F4EEE4; --ink:#2C2620; --soft:#4A4036; --muted:#7A6E60; --faint:#A39684; --rule:#E3D9CA; --tint:#FBF8F2; --link:#3F7A8C; --grow-ink:#B5603F; --tend:#B98A2E; --terra:#B5603F; --water:#3F7A8C; color-scheme:light;
  --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; --display:"Fraunces",Georgia,serif; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ground:#1B1A1F; --ink:#EDE4E0; --soft:#D3C8C3; --muted:#A3958F; --faint:#72686A; --rule:#3A3336; --tint:#262228; --link:#8CC3C3; --grow-ink:#F0A79E; --tend:#E3BB77; --terra:#E08A7F; --water:#8CC3C3; color-scheme:dark; } }
:root[data-theme="dark"]{ --ground:#1B1A1F; --ink:#EDE4E0; --soft:#D3C8C3; --muted:#A3958F; --faint:#72686A; --rule:#3A3336; --tint:#262228; --link:#8CC3C3; --grow-ink:#F0A79E; --tend:#E3BB77; --terra:#E08A7F; --water:#8CC3C3; color-scheme:dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding:32px 16px 48px}
.chip{font:400 .72rem var(--mono);color:var(--faint)}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:14px 0 0}
h1{font-size:clamp(2rem,8vw,2.6rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:6px 0 0}
.range{color:var(--soft);font-weight:600;margin:6px 0 0}
section{padding-block:22px;border-top:1px solid var(--rule);margin-top:22px}
.label{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 4px}
.note{font-size:.8rem;color:var(--muted);margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--tint);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:.75rem;color:var(--muted)}
.drive{margin:0 0 14px}
.drive .sub{margin:10px 0 0 6px;padding-left:12px;border-left:2px solid var(--rule)}
.dh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.dh .n{font-weight:800}
.dh .m{margin-left:auto;font:400 .74rem var(--mono);color:var(--muted);white-space:nowrap}
.own{font:400 .7rem var(--mono);color:var(--faint);margin:2px 0 0}
details{margin:6px 0 0}
summary{cursor:pointer;font-size:.8rem;color:var(--link)}
ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
li{font-size:.9rem;line-height:1.35}
li .set,li .due{font-size:.74rem;color:var(--muted)}
a{color:var(--link)}
.foot{font:400 .7rem var(--mono);color:var(--faint);line-height:1.6}
.warn{color:var(--grow-ink)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:7.5rem 1fr 4.2rem;gap:8px;align-items:center;font-size:.85rem}
.bar .t{height:10px;border-radius:5px;background:var(--rule);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:5px;background:var(--tend)}
.bar .t i.grow{background:var(--grow-ink)}
.bar .t i.rest{background:var(--link)}
.bar .v{font:400 .74rem var(--mono);color:var(--muted);text-align:right}
.days{width:100%;border-collapse:collapse;font-size:.82rem}
.days th{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:right;padding:4px 4px}
.days th:first-child,.days td:first-child{text-align:left}
.days td{padding:5px 4px;border-top:1px solid var(--rule);text-align:right;font-family:var(--mono);font-size:.74rem;color:var(--soft)}
.days td.s{font-family:var(--sans);font-size:.8rem}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--rule);min-width:60px}
.split i{display:block;height:100%}
.split .d{background:var(--tend)} .split .g{background:var(--grow-ink)}
.side{margin:0 0 14px}
.side h3{font-size:.95rem;font-weight:800;margin:0 0 2px}
.side .says{font-size:.78rem;color:var(--muted);margin:0 0 6px}
.lead{font-size:.95rem;line-height:1.45;color:var(--soft);margin:0 0 12px}
.hd{font:500 italic clamp(1.9rem,7vw,2.4rem)/1.1 var(--display);color:var(--terra);margin:6px 0 0;letter-spacing:0}
.flowed{display:grid;gap:8px;margin:14px 0 0}
.riv{background:var(--tint);border:1px solid var(--rule);border-radius:16px;padding:12px 10px 10px;margin:14px 0 0}
#river{display:block;width:100%;min-width:640px;height:auto;overflow:visible}
.rscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (min-width:800px){.riv{margin-left:-64px;margin-right:-64px}}
#river text{font-family:var(--sans);fill:var(--ink)}
#river .sl{font:600 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;fill:var(--muted);paint-order:stroke;stroke:var(--tint);stroke-width:3px;stroke-linejoin:round}
#river .dl{font:500 10px var(--mono);fill:var(--muted)}
#river .nl{font-size:11px;font-weight:600;paint-order:stroke;stroke:var(--tint);stroke-width:3px;stroke-linejoin:round}
#river .nc{font:400 9.5px var(--mono);fill:var(--muted);paint-order:stroke;stroke:var(--tint);stroke-width:3px;stroke-linejoin:round}
#river path{fill:none;stroke-linecap:butt;transition:opacity .2s}
#river .node{cursor:pointer}
#river .node:focus-visible rect{stroke:var(--ink);stroke-width:2}
#river.on path:not(.lit),#river.on .pt:not(.lit){opacity:.12}
#river .pt{transition:opacity .2s}
.rkey{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 4px 0;font-size:.74rem;color:var(--soft)}
.rkey i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hint{font:400 .72rem var(--mono);color:var(--muted);margin:6px 4px 0}
.stone.dim{display:none}
.sd.empty{display:none}
.fw{background:var(--tint);border:1px solid var(--rule);border-radius:14px;padding:10px 14px;display:grid;gap:2px}
.fw b{font-size:1rem}.fw .v{font:400 .74rem var(--mono);color:var(--muted)}
.fw .ds{font:400 .74rem var(--mono);color:var(--water);overflow-wrap:anywhere}
.fw.none b{color:var(--soft)}
/* a tile opens to the moments that reached it; each one jumps to its card in the stream (22 Oct 2026) */
details.fw{padding:0}
details.fw>summary{list-style:none;cursor:pointer;padding:10px 14px;display:grid;gap:3px;border-radius:14px}
details.fw>summary::-webkit-details-marker{display:none}
details.fw>summary:focus-visible{outline:2px solid var(--link);outline-offset:2px}
details.fw .v::after{content:" · show";color:var(--link)}
details.fw[open] .v::after{content:" · hide"}
.fm{display:grid;gap:2px;margin:0;padding:0 8px 10px;list-style:none;border-top:1px solid var(--rule)}
.fm button{all:unset;cursor:pointer;display:grid;grid-template-columns:1.6rem 3.4rem minmax(0,1fr);align-items:baseline;gap:6px;padding:7px 6px;border-radius:10px;font-size:.88rem;line-height:1.35;color:var(--ink)}
.fm button:hover,.fm button:focus-visible{background:var(--ground)}
.fm button:focus-visible{outline:2px solid var(--link)}
.fm .tm{font:400 .72rem var(--mono);color:var(--muted)}
.stone.hit{outline:2px solid var(--link);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.stone{transition:outline-color .6s}}
.stream{position:relative;margin:8px 0 0;padding-left:26px}
.stream::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--water),var(--terra))}
.sd{position:relative;margin:0 0 22px}
.sd:last-child{margin-bottom:0}
.sd::before{content:"";position:absolute;left:-23px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--ground);border:3px solid var(--water)}
.sd h2{font:600 .78rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.sd .dl{font:500 italic 1.1rem/1.3 var(--display);color:var(--terra);margin:2px 0 8px}
.stone{background:var(--tint);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;margin:0 0 8px;display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:2px 10px}
.stone .g{font-size:1.6rem;line-height:1}
.stone .body{display:grid;gap:2px;min-width:0}
.stone .tt{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.stone .bd{font-size:.82rem;margin-left:4px}
.stone .her{font-style:italic;font-size:.9rem;line-height:1.45;color:var(--soft);overflow-wrap:anywhere}
.her .more{font:500 .78rem var(--sans);font-style:normal;color:var(--link);background:none;border:0;padding:0;cursor:pointer}
.her .more:focus-visible{outline:2px solid var(--terra);outline-offset:2px;border-radius:3px}
.stone .her [hidden]{display:none}
.stone .meta{font:400 .74rem var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.stone .to{font:400 .72rem var(--mono);color:var(--water);overflow-wrap:anywhere}
.stone.big{border-color:var(--terra);box-shadow:inset 3px 0 0 var(--terra)}
/* a lead or story nobody has seen yet: a dashed mark by the chip and a dashed rule down the part (the day behind's draft) */
.draft{font:500 .66rem var(--mono);color:var(--water);border:1px dashed var(--water);border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap}
[data-draft]{border-left:2px dashed var(--water);padding-left:12px}
.dlead{font:500 italic 1.25rem/1.35 var(--display);color:var(--ink);margin:0}
.dstory{margin:12px 0 4px;display:grid;gap:6px}
.dstory li{display:grid;grid-template-columns:1.8rem minmax(0,1fr);font-size:.95rem;line-height:1.4;color:var(--soft)}
.sh{font:500 italic clamp(1.6rem,6.5vw,2.1rem)/1.2 var(--display);color:var(--terra);margin:8px 0 0;text-wrap:balance}
.moments{display:grid;gap:18px;margin:10px 0 0}
.mo{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:10px}
.mo .g{font-size:1.5rem;line-height:1.2}
.mo .tt{font-weight:600;line-height:1.35;margin:0}
.mo .her{font-style:italic;font-size:.92rem;line-height:1.5;color:var(--soft);margin:3px 0 0}
.mo .her summary{list-style:none;cursor:pointer;color:var(--soft);font-size:.92rem}
.mo .her summary::-webkit-details-marker{display:none}
.mo .her summary b{font-style:normal;font-weight:500;color:var(--link);font-size:.78rem}
.mo .meta{font:400 .72rem var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px;margin:4px 0 0}
.mo .ph{display:grid;gap:6px;margin:8px 0 0}
.mo .ph img,.stone .ph img{display:block;width:100%;max-width:100%;border-radius:12px}
.stone .ph{display:grid;gap:6px;margin:6px 0 2px}
.pics{display:flex;gap:10px;overflow-x:auto;margin:16px 0 0;padding-bottom:6px;scroll-snap-type:x mandatory}
.pics figure{margin:0;flex:0 0 min(68%,240px);scroll-snap-align:start;min-width:0}
.pics img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;background:var(--tint)}
.pics figcaption{font:400 .72rem var(--mono);color:var(--muted);margin-top:4px;line-height:1.35}
.mv{display:grid;gap:14px;margin:10px 0 0}
.mv .dh{display:flex;align-items:baseline;gap:8px;margin:0;font-size:.95rem}
.mv .dh .n{font-weight:600}
.mv .dh .fin{font:600 .72rem var(--sans);color:var(--rb-move-d);white-space:nowrap}
.mv .dh .m{font:400 .72rem var(--mono);color:var(--muted);margin-left:auto;white-space:nowrap}
.mv ul{list-style:none;margin:4px 0 0;padding:0 0 0 1.9rem;display:grid;gap:3px}
.mv li{font-size:.86rem;line-height:1.4;color:var(--soft)}
/* how the day went — the rainbow (24 Oct 2026, docs/day-behind-cards.md): neutral flows, cool hues for being,
   warm hues for doing, the night in blue in the gap; every colour a token, light and dark */
:root{--rb-flow:#DDD5C9;--rb-flow-d:#8C8174;--rb-flow-t:#F1ECE4;--rb-eat:#86C2A4;--rb-move:#B4C987;--rb-recreation:#9FC4E2;--rb-being-t:#EEF4F3;--rb-being-d:#4F7F78;
--rb-syn:#F2C14E;--rb-syn-d:#B8860B;--rb-work:#C9805F;--rb-care:#E3A4A8;--rb-family:#E3A4A8;--rb-pet:#EBB9CB;--rb-community:#E8B08F;--rb-social:#AEB9E6;--rb-home:#DDB4A2;--rb-personal:#C3B6E2;--rb-cook:#EEB672;--rb-system:#DCC89C;--rb-drive:#A9B7C2;--rb-travel:#A8D3C9;--rb-doing-t:#FAF0EA;--rb-doing-d:#94593D;--rb-screen:#2C2620;--rb-screen-d:#2C2620;--rb-screen-t:#ECE5DA;
--rb-sleep:#D4DEF0;--rb-sleep-deep:#6F8CC4;--rb-sleep-d:#5A73A8;--rb-eat-d:#3F8A68;--rb-move-d:#6E8A35;--rb-recreation-d:#4A7FAE;--rb-work-d:#8E4A2C;--rb-care-d:#B05E66;--rb-family-d:#B05E66;--rb-pet-d:#A85C7A;--rb-community-d:#A8603E;--rb-social-d:#4E5DA3;--rb-home-d:#96604A;--rb-personal-d:#6B5BA0;--rb-cook-d:#B07A2A;--rb-system-d:#9C8455;--rb-drive-d:#56697A;--rb-travel-d:#3E7F74}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--rb-syn:#F5CF6A;--rb-syn-d:#F5CF6A;--rb-flow:#4A4540;--rb-flow-d:#BDB3A6;--rb-flow-t:#2B2830;--rb-being-t:#24302D;--rb-being-d:#CDE7DF;--rb-doing-t:#352B27;--rb-doing-d:#F4E0D4;--rb-screen:#EDE4E0;--rb-screen-d:#EDE4E0;--rb-screen-t:#2E2A30;--rb-sleep:#3A4766;--rb-sleep-deep:#8FA8DA;--rb-sleep-d:#C9D6EE;--rb-eat-d:#C4E6D4;--rb-move-d:#DCE8BC;--rb-recreation-d:#CFE2F2;--rb-work-d:#F0C6B2;--rb-care-d:#F5D0D2;--rb-family-d:#F5D0D2;--rb-pet-d:#F6D3E0;--rb-community-d:#F6D7C8;--rb-social-d:#DADFF5;--rb-home-d:#F0D6CA;--rb-personal-d:#DED6F4;--rb-cook-d:#F7D9AE;--rb-system-d:#EEE2C6;--rb-drive-d:#D3DEE7;--rb-travel-d:#CDEAE4}}
:root[data-theme="dark"]{--rb-syn:#F5CF6A;--rb-syn-d:#F5CF6A;--rb-flow:#4A4540;--rb-flow-d:#BDB3A6;--rb-flow-t:#2B2830;--rb-being-t:#24302D;--rb-being-d:#CDE7DF;--rb-doing-t:#352B27;--rb-doing-d:#F4E0D4;--rb-screen:#EDE4E0;--rb-screen-d:#EDE4E0;--rb-screen-t:#2E2A30;--rb-sleep:#3A4766;--rb-sleep-deep:#8FA8DA;--rb-sleep-d:#C9D6EE;--rb-eat-d:#C4E6D4;--rb-move-d:#DCE8BC;--rb-recreation-d:#CFE2F2;--rb-work-d:#F0C6B2;--rb-care-d:#F5D0D2;--rb-family-d:#F5D0D2;--rb-pet-d:#F6D3E0;--rb-community-d:#F6D7C8;--rb-social-d:#DADFF5;--rb-home-d:#F0D6CA;--rb-personal-d:#DED6F4;--rb-cook-d:#F7D9AE;--rb-system-d:#EEE2C6;--rb-drive-d:#D3DEE7;--rb-travel-d:#CDEAE4}
.rb svg{display:block;width:calc(100% + 24px);max-width:560px;height:auto;margin:4px -12px 0;overflow:visible}
@media (min-width:600px){.rb svg{margin:4px auto 0;width:100%}}
.rb svg text{font-family:var(--mono);fill:var(--muted)}
.rb svg [data-tip]{cursor:pointer}
.rb svg [data-tip]:focus-visible,.rb svg [data-tip].on{outline:none;stroke:var(--ink);stroke-width:2}
.rb .tip{min-height:3.2em;margin:4px 0 0;padding:10px 12px;border-radius:12px;background:var(--tint);font-size:.86rem;line-height:1.45;color:var(--soft)}
.rb .tip b{color:var(--ink);font-weight:600}
.rb .bars{display:grid;gap:7px;margin:14px 0 0}
.rb .bh{margin:8px 0 0;font:600 .68rem var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rb .bh span{font:500 .72rem var(--mono);letter-spacing:0;text-transform:none;margin-left:6px}
.rb .br{display:grid;grid-template-columns:6.2rem minmax(0,1fr) 4.8rem;align-items:center;gap:10px}
.rb .bn{font-size:.84rem;color:var(--soft);line-height:1.2}
.rb .bn small{display:block;font-size:.7rem;color:var(--muted);margin-top:1px}
.rb .who{margin:22px 0 4px}.rb .wstrip{position:relative;height:16px;border-radius:8px;background:var(--rb-doing-t);overflow:hidden;margin:6px 0 2px}
.rb .wstrip i{position:absolute;top:0;bottom:0}.rb .wends{display:flex;justify-content:space-between;margin:0 0 8px;font:400 .68rem var(--mono);color:var(--muted)}
:root{--who-alone:#A9CFCB;--who-alone-d:#4F8A8B;--who-family:#E8C48A;--who-family-d:#B98A2E;--who-social:#E3A097;--who-social-d:#BE5B50;--who-work:#C77267;--who-work-d:#A04A40}
.rb .w-alone{background:var(--who-alone);border-color:var(--who-alone-d)}.rb .w-family{background:var(--who-family);border-color:var(--who-family-d)}
.rb .w-social{background:var(--who-social);border-color:var(--who-social-d)}.rb .w-work{background:var(--who-work);border-color:var(--who-work-d)}
.rb .who .bt i{border-width:1.5px;border-style:solid}
.rb .wp{margin:6px 0 0;font-size:.84rem;line-height:1.45;color:var(--soft)}.rb .wp small{font:400 .7rem var(--mono);color:var(--muted)}
.rb .wc{display:block;font:600 .68rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rb .circles{display:grid;gap:10px;margin-top:12px}.rb .circ{background:var(--tint,rgba(255,255,255,.5));border-radius:14px;padding:12px 14px}
.rb .circl{margin:0 0 8px;font:600 .68rem var(--mono);letter-spacing:.12em;text-transform:uppercase}
.rb .circp{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.rb .pchip{display:inline-flex;align-items:baseline;gap:7px;border:1.5px solid var(--cc);border-radius:999px;padding:4px 12px;font-weight:600;line-height:1.2;color:var(--ink)}
.rb .pchip small{font:500 .68rem var(--mono);color:var(--muted)}.rb .pchip.far{border-style:dashed;font-weight:500;font-size:.85rem}
.rb .wment{margin:10px 0 0;font-size:.8rem;color:var(--muted);line-height:1.45}
.rb .energy{margin:26px 0 4px}.rb .ewheel{width:100%;max-width:400px;height:auto;display:block;margin:4px auto 10px}
.rb .elegend{display:grid;gap:6px;padding-left:6px}.rb .epair{border-left:3px solid;padding:2px 0 2px 10px;display:grid;gap:3px}
.rb .erow{display:grid;grid-template-columns:18px 52px 1fr auto;gap:8px;align-items:baseline;font-size:.8rem}
.rb .erow svg{width:15px!important;height:15px!important;display:block}.rb .enm{font-weight:700}.rb .edf{color:var(--soft);line-height:1.35}.rb .ev{font:500 .78rem var(--mono);color:var(--ink);white-space:nowrap}
.rb .enote{margin:10px 0 0;font-size:.76rem;color:var(--muted);line-height:1.45}
.rb .vline{margin:2px 0 10px;font:700 1.06rem/1.35 var(--sans);color:var(--ink);text-wrap:balance}
.rb .emore summary{cursor:pointer;font-size:.82rem;font-weight:600;color:var(--link);padding:4px 0}
.rb .balbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:8px 0 6px}.rb .balbar span{display:block;height:100%}
.rb .ballab{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin:0;font:600 .86rem var(--sans)}
.rb .ballab i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 3px 0 8px}.rb .ballab b{font-weight:800}
.rb .with{margin:10px 0 4px}.rb .with p{margin:0 0 4px;font-size:.84rem;line-height:1.35;color:var(--soft)}
.rb .with .wt{display:block;font:500 .72rem var(--mono);color:var(--muted);text-transform:none}
.rb .bt{position:relative;height:14px;border-radius:7px;background:var(--tint)}
.rb .bt i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;border:1.5px solid;min-width:3px}
.rb .bt b{position:absolute;top:-4px;bottom:-4px;width:2.5px;margin-left:-1px;border-radius:2px;background:var(--ink)}
.rb .bv{font:500 .8rem var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink);line-height:1.15}
.rb .bv small{display:block;font-size:.68rem;color:var(--muted)}
.rb .their{margin:18px 0 0}
.rb .their .tt{position:relative;height:14px;border-radius:7px;background:var(--tint);margin:6px 0 0}
.rb .their .tt i{position:absolute;top:0;bottom:0;border-radius:7px;background:var(--rb-family);border:1.5px solid var(--rb-family-d)}

.tex{font-size:.8rem;color:var(--muted);line-height:1.5;margin:2px 0 0}
details.numbers{margin:0}

.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.fl{background:var(--tint);border-radius:16px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}

.gkey{display:flex;flex-wrap:wrap;gap:4px 12px;margin:12px 0 0;font-size:.72rem;color:var(--muted)}
.gkey i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
/* her own light/dark switch (28 Oct 2026): the app's viewer opens the page light even with the app dark */
.theme{position:absolute;top:20px;right:max(16px,calc(50% - 294px));width:36px;height:36px;border-radius:50%;border:1px solid var(--rule);
  background:var(--tint);color:var(--muted);font:400 1.05rem/1 var(--sans);cursor:pointer;display:grid;place-items:center;padding:0}
.theme:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.wrap .chip{padding-right:44px}

<body><button class="theme" id="theme" type="button" aria-label="Switch to dark"></button><div class="wrap" id="page"></div>
<script>
// the choice is kept on her phone; without storage the page still switches, it just forgets
(() => {
  const R = document.documentElement, B = document.getElementById("theme"), KEY = "bedo-theme";
  const now = () => R.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const show = () => { const d = now() === "dark"; B.innerHTML = d ? "&#9728;&#65038;" : "&#9790;"; B.setAttribute("aria-label", d ? "Switch to light" : "Switch to dark"); };
  try { const s = localStorage.getItem(KEY); if (s === "dark" || s === "light") R.dataset.theme = s; } catch (e) {}
  B.addEventListener("click", () => { const t = now() === "dark" ? "light" : "dark"; R.dataset.theme = t; show();
    try { localStorage.setItem(KEY, t); } catch (e) {} });
  show();
})();
</script>
<script>
const DATA = /*__DATA__*/null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hm = m => { m = Math.round(m || 0); const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h} h ${String(r).padStart(2, "0")}` : `${h} h`) : `${r} min`; };
const T = DATA.totals, P = document.getElementById("page");
// one engine for the week and for a single day drawn the same way (20 Oct 2026)
const SP = DATA.span || "week", ND = DATA.ndays || 7, ONE = SP === "day";
const extra = (n, w) => n ? ` · ${n} ${w}` : "";
P.innerHTML = `<div class="chip">${esc(DATA.chip)}</div>
<p class="eyebrow">the look behind · the ${SP} · ${esc(DATA.week)} · ${esc(DATA.range)}</p>
<h1 class="hd">what gave the ${SP} meaning</h1>
<p class="lead" id="slead" style="margin-top:8px"></p>
<div class="card riv"><div class="rscroll"><svg id="river" role="img" aria-label="Each moment that mattered, flowing from its day to the flow, rhythm or drive it belongs to, and on to the destinations they serve"></svg></div>
<div class="rkey" id="rkey"></div><p class="hint" id="rhint">tap a flow, rhythm, drive or destination to see just its moments below</p></div>
<div class="stream" id="stream"></div>
<details class="numbers"><summary>the numbers · time, rest, needs, drives</summary>
<section><p class="label">where the time went</p>
<p class="lead" id="cover"></p>
<p class="note">minutes from rows with a real span; two things at once both count, as on the wheel, and time with somebody counts toward heart whatever else it was; sleep is time in bed, not an area</p>
<div class="stats"><div class="stat"><b>${hm(DATA.time.be)}</b><span>being</span></div>
<div class="stat"><b>${hm(DATA.time.tend + DATA.time.grow)}</b><span>doing · ${hm(DATA.time.grow)} growing</span></div>
<div class="stat"><b>${hm(DATA.time.people)}</b><span>with people</span></div></div>
<div class="bars" id="areas" style="margin-top:14px"></div></section>
<section><p class="label">what moved forward</p>
<p class="note">every action closed in the ${SP}, and what is in motion and was touched in it</p>
<div id="moved"></div></section>
<section><p class="label">rest as a reset</p>
<p class="lead" id="restlead"></p>
<div id="restdays"></div></section>
<section><p class="label">needs · on the secure base</p>
<p class="lead" id="needlead"></p>
<div id="needs"></div><div id="needdays"></div></section>
<section><p class="label">the ${SP} on its drives</p>
<p class="note">each counted once${extra(hm(T.min_no_drive) !== "0 min" ? hm(T.min_no_drive) : "", "logged on no drive")}${extra(T.closed_no_drive, "closed on no drive")}${extra(T.open_no_drive, "open on no drive")}</p>
<div class="stats"><div class="stat"><b>${hm(T.min)}</b><span>on drives</span></div>
<div class="stat"><b>${T.closed}</b><span>✅ closed</span></div>
<div class="stat"><b>${T.open}</b><span>still open</span></div></div></section>
<section><p class="label">by drive</p>
<p class="note">the drives that moved this ${SP}; a drive that feeds another sits under it, and its time and counts are in the parent's numbers</p>
<div id="drives"></div><details id="quiet"><summary></summary><div id="quietdrives" style="margin-top:10px"></div></details></section>
</details></article>
</div>
<section class="foot" id="foot"></section>`;
// one drive: its numbers including what feeds it, then its own lists, then the drives that feed it
const node = n => {
  const nums = [n.min ? hm(n.min) : "", n.closed ? `${n.closed} ✅` : "", n.open ? `${n.open} open` : ""].filter(Boolean).join(" · ");
  const own = n.children.length && (n.own_min !== n.min || n.closed_own !== n.closed || n.open_own !== n.open)
    ? `<p class="own">its own: ${[hm(n.own_min), n.closed_own + " ✅", n.open_own + " open"].join(" · ")}</p>` : "";
  const done = n.done.length ? `<details><summary>${n.done.length} closed</summary><ul>${n.done.map(d =>
    `<li>✅ ${d.url ? `<a href="${esc(d.url)}">${esc(d.t)}</a>` : esc(d.t)}${d.set ? ` <span class="set">set as: ${esc(d.set)}</span>` : ""}</li>`).join("")}</ul></details>` : "";
  const still = n.still.length ? `<details><summary>${n.still.length} still open</summary><ul>${n.still.map(s =>
    `<li>${esc(s.st)} ${esc(s.t)}${s.due ? ` <span class="due">· ${esc(s.due)}</span>` : ""}</li>`).join("")}</ul></details>` : "";
  return `<div class="drive"><div class="dh"><span>${esc(n.emoji)}</span><span class="n">${esc(n.drive)}</span><span class="m">${nums}</span></div>${own}${done}${still}` +
    (n.children.length ? `<div class="sub">${n.children.map(node).join("")}</div>` : "") + `</div>`;
};
// only the drives that moved are shown; the ones holding open items alone fold away (19 Oct 2026: the drive list is overwhelming)
const moved = n => n.min > 0 || n.closed > 0;
const live = DATA.drives.filter(moved), quiet = DATA.drives.filter(n => !moved(n));
document.getElementById("drives").innerHTML = live.length ? live.map(node).join("") : `<p class="note">no drive moved this ${SP}</p>`;
if (quiet.length) {
  document.querySelector("#quiet summary").textContent = `${quiet.length} more drives, open items only · ${quiet.reduce((s, n) => s + n.open, 0)} open`;
  document.getElementById("quietdrives").innerHTML = quiet.map(node).join("");
} else document.getElementById("quiet").remove();
if ((DATA.forecasts || []).length)   // 🔭 forecasts due in the window, hers to say how each turned out (20 Oct 2026)
  document.getElementById("foot").insertAdjacentHTML("beforebegin", `<section aria-label="forecasts due"><p class="note">\u{1F52D} forecasts due this ${SP} \u00B7 how did each turn out? in your words</p><ul>${DATA.forecasts.map(f => `<li>${esc(f.t)}</li>`).join("")}</ul></section>`);
document.getElementById("foot").innerHTML = `read ${esc(DATA.read)}` +
  (DATA.loops.length ? `<br><span class="warn">feeds loops — fix in the base: ${DATA.loops.map(esc).join(" · ")}</span>` : "") +
  `<br>not built yet: the reading, the wheel, who was there`;
// what gave the week meaning — the stream (19 Oct 2026, her words: what the thing was, a picture,
// a few words, an emoji for the kind, and how it fits — the map's rhythm → drive → destination)
const SM = DATA.stream || {days: [], flowed: [], n: 0};
const cap = x => x ? x[0].toUpperCase() + x.slice(1) : x;
const inTrip = SM.flowed.filter(f => f.n).reduce((n, f) => n + f.n_moments, 0);
document.getElementById("slead").textContent = SM.n
  ? `${SM.n} moments mattered this week. Up top, the two flows you return to every day — how much of each you did, and whether you closed it. Below, each moment is what it was, in your words, on the rhythm or drive it lived in; a purple dot means a flow caught it.`
  : "no moments marked this week — a highlight, a glimmer, a gratitude or a few lines of your words is what lands here";
// a long passage shows its opening; "more" reveals only the rest, in place (20 Oct 2026: no repeated text)
const clock = at => { const [h, m] = at.slice(11, 16).split(":").map(Number); return `${h % 12 || 12}:${String(m).padStart(2, "0")}${h < 12 ? "a" : "p"}`; };
const words = w => {
  if (!w) return "";
  if (w.length <= 260) return `<div class="her">${esc(w)}</div>`;
  const head = w.slice(0, 240).replace(/\s+\S*$/, ""), rest = w.slice(head.length);
  return `<div class="her">${esc(head)}<span class="rest" hidden>${esc(rest)}</span><span class="dots">…</span> ` +
    `<button type="button" class="more" onclick="const h=this.parentNode,r=h.querySelector('.rest'),o=r.hidden;r.hidden=!o;h.querySelector('.dots').hidden=o;this.textContent=o?'less':'more'">more</button></div>`;
};
const sid = m => m.at;
const stone = m => {
  const meta = [m.people.length ? `with ${esc(m.people.join(", "))}` : "",
    m.theirs.length ? `🌟 ${esc(m.theirs.map(cap).join(", "))}'s too` : "",
    m.memory ? `↺ ${esc(m.memory)}` : "", m.synergy ? "∞ more because it was shared" : "", m.photo ? "📷 a photo" : ""].filter(Boolean);
  const path = [m.envelope, ...m.drives.map(d => `${d.e} ${d.n}`), ...m.dests.map(d => `${d.e} ${d.n}`)].filter(Boolean);
  const flowline = m.flow ? `<div class="to">caught in ${esc(m.flow.e)} ${esc(m.flow.n)}</div>` : "";
  const big = m.memory || m.synergy || (m.words || "").length > 500;
  return `<div class="stone${big ? " big" : ""}" data-at="${esc(sid(m))}"><span class="g">${esc(m.g || "·")}</span><div class="body">` +
    `<div class="tt">${esc(m.t)}${m.badges.length ? `<span class="bd">${esc(m.badges.join(" "))}</span>` : ""}</div>` +
    words(m.words) + ((m.photos || []).length ? `<div class="ph">${m.photos.map(src => `<img src="${src}" alt="" loading="lazy">`).join("")}</div>` : "") +
    (meta.length ? `<div class="meta">${meta.map(x => `<span>${x}</span>`).join("")}</div>` : "") +
    flowline + (path.length ? `<div class="to">→ ${path.map(esc).join(" → ")}</div>` : "") + `</div></div>`;
};
document.getElementById("stream").innerHTML = SM.days.map(d =>
  `<div class="sd" data-day="${esc(d.date)}"><h2>${esc(d.label)}</h2>${d.lead ? `<div class="dl">${esc(d.lead)}</div>` : `<div style="height:6px"></div>`}` +
  d.stones.map(stone).join("") +
  (d.texture.length ? `<p class="tex">also: ${d.texture.map(x => `${esc(x.g)} ${esc(x.t)}`).join(" · ")}</p>` : "") + `</div>`).join("");
// the river, on time (20 Oct 2026, her words: show the flow of time). The week runs left to right;
// each place a moment belongs to is a lane (the flows on the being side first, then rhythms and
// drives); each moment sits on its lane at its time, as its emoji; a lane thickens as moments
// gather on it and ends in the destination it serves. An envelope (the trip) is a band behind
// its days. Colour is the KIND of place (validated: dataviz validate_palette, light and dark).
(function () {
  const svg = document.getElementById("river"); if (!svg || !SM.n || ONE) { document.querySelector(".riv")?.remove(); return; }
  const dark = (matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.dataset.theme !== "light")
    || document.documentElement.dataset.theme === "dark";
  const KC = dark ? {flow: "#9b6fd6", rhythm: "#199e70", drive: "#d95926", destination: "#3987e5"}
                  : {flow: "#8a5bc0", rhythm: "#1baf7a", drive: "#eb6834", destination: "#2a78d6"};
  const KN = {flow: "a flow · the dot marks a moment it caught", rhythm: "rhythm", drive: "drive", destination: "destination"};
  const order = {flow: 0, rhythm: 1, drive: 2, destination: 3};
  const moments = SM.days.flatMap(d => d.stones);
  const lanes = new Map();
  const lane = (key, n, e, type) => { if (!lanes.has(key)) lanes.set(key, {key, n, e, type, ms: [], dests: new Map()}); return lanes.get(key); };
  moments.forEach(m => {
    // a flow is a practice she returns to every day, not a place she goes: a moment caught in a flow
    // lives on the rhythm or drive it was about, and the flow row above only holds what has no other home
    const own = [];
    const ds = m.drives || [];
    if (ds.length) own.push(lane("d:" + ds[0].n, ds[0].n, ds[0].e, ds[0].type));
    else if ((m.dests || []).length) own.push(lane("d:" + m.dests[0].n, m.dests[0].n, m.dests[0].e, "destination"));
    own.forEach(l => { l.ms.push(m); if (ds.length && l.key === "d:" + ds[0].n) (m.dests || []).forEach(d => l.dests.set(d.n, d)); });
    m._lanes = own;
  });
  const L = [...lanes.values()].sort((a, b) => order[a.type] - order[b.type] || b.ms.length - a.ms.length);
  const t0 = new Date(SM.days[0].date + "T00:00:00"), t1 = new Date(t0.getTime() + 7 * 864e5);
  const W = 700, LX = 140, RX = 486, DX = 496, LH = 34, BH = 30;
  const BE = SM.be || [], FL = SM.flows || [];
  const top = 30 + (BE.length ? FL.length * BH + 30 : 0), btop = 44;
  const X = iso => LX + (RX - LX) * Math.max(0, Math.min(1, (new Date(iso) - t0) / (t1 - t0)));
  // a busy lane gets more rows: each moment takes the first row where it doesn't touch the one before
  L.forEach(l => {
    const last = [];
    l.ms.sort((a, b) => a.at < b.at ? -1 : 1).forEach(m => {
      const x = X(m.at); let r = last.findIndex(v => x - v >= 18); if (r < 0) { r = last.length; last.push(x); } else last[r] = x; m._row = m._row || {}; m._row[l.key] = r;
    });
    l.rows = Math.max(1, last.length);
  });
  let yy = top; L.forEach(l => { l.h = Math.max(LH, 18 * l.rows + 12); l.y = yy + 14; yy += l.h; });
  const H = yy + 12;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  let out = "";
  // the days, as columns
  SM.days.forEach((d, i) => {
    const x = LX + (RX - LX) * i / 7;
    out += `<line x1="${x}" y1="24" x2="${x}" y2="${H - 6}" stroke="var(--rule)" stroke-width="1"/>` +
      `<text class="dl" x="${x + (RX - LX) / 14}" y="12" text-anchor="middle">${esc(d.label.split(" ")[0])}</text>` +
      `<text class="dl" x="${x + (RX - LX) / 14}" y="22" text-anchor="middle">${esc(d.label.split(" ")[1])}</text>`;
  });
  // the being side: each flow, each day — how much of it was done, and whether it was closed
  if (BE.length) {
    out += `<text class="sl" x="4" y="${btop - 6}">being · the flows, every day</text>` +
      `<text class="sl" x="4" y="${top - 12}">doing · where the moments lived</text>` +
      `<line x1="4" y1="${top - 26}" x2="${RX}" y2="${top - 26}" stroke="var(--rule)" stroke-dasharray="2 3"/>`;
    FL.forEach((f, j) => {
      const y = btop + 10 + j * BH, caught = moments.filter(m => m.flow && m.flow.n === f.n);
      const done = BE.filter(d => d[f.k].n || d[f.k].closed).length;
      out += `<g class="node" tabindex="0" role="button" data-ids="${esc(caught.map(sid).join(" "))}" aria-label="${esc(f.n)}: ${caught.length} moment${caught.length === 1 ? "" : "s"} caught">` +
        `<text class="nl" x="4" y="${y - 1}">${esc(f.e)} ${esc(f.n)}</text>` +
        `<text class="nc" x="4" y="${y + 11}">${done} of 7 days · ${caught.length} caught</text>`;
      BE.forEach((d, i) => {
        const v = d[f.k], cx = LX + (RX - LX) * (i + .5) / 7, r = v.n ? Math.min(11, 4 + 1.6 * Math.sqrt(v.n)) : 3;
        const say = `${d.date.slice(5)} · ${f.n}: ${v.n} practice${v.n === 1 ? "" : "s"}${v.closed ? " · closed" : v.n ? " · not closed" : ""}${v.g.length ? " · " + v.g.join(" ") : ""}`;
        out += v.n || v.closed
          ? `<circle cx="${cx}" cy="${y}" r="${r}" fill="${KC.flow}" fill-opacity="${v.n ? .22 : 0}" stroke="${KC.flow}" stroke-width="1.5"${v.closed ? "" : ` stroke-dasharray="2 2"`}><title>${esc(say)}</title></circle>` +
            (v.n ? `<text class="nc" x="${cx}" y="${y + 3}" text-anchor="middle" style="stroke-width:2px">${v.n}</text>` : "")
          : `<circle cx="${cx}" cy="${y}" r="2" fill="var(--rule)"><title>${esc(say)}</title></circle>`;
      });
      // moments the flow caught that have no rhythm or drive of their own sit here, at their time
      caught.filter(m => !m._lanes.length).forEach(m => {
        const cx = X(m.at) + 12;
        out += `<g class="pt" data-ids="${esc(sid(m))}"><circle cx="${cx}" cy="${y - 8}" r="8" fill="var(--tint)" stroke="${KC.flow}" stroke-width="1.5"/>` +
          `<text x="${cx}" y="${y - 4.5}" text-anchor="middle" font-size="9">${esc(m.g || "·")}</text><title>${esc(m.t)}</title></g>`;
      });
      out += `</g>`;
    });
  }
  // the envelopes (the trip), whole days, behind everything
  (SM.bands || []).forEach(b => {
    const a = X(b.a.slice(0, 10) + "T00:00:00"), z = X(new Date(new Date(b.b.slice(0, 10) + "T00:00:00").getTime() + 864e5).toISOString());
    out = `<rect x="${a}" y="${top - (BE.length ? 22 : 30)}" width="${Math.max(2, z - a)}" height="${H - top + (BE.length ? 18 : 26)}" rx="8" fill="var(--terra)" fill-opacity=".07"/>` +
      `<text class="nc" x="${a + 4}" y="${H - 1}">${esc(b.t)}</text>` + out;
  });
  // each lane: its label, a stream that thickens as moments gather, its moments, and where it leads
  L.forEach(l => {
    const c = KC[l.type], ms = [...l.ms].sort((a, b) => a.at < b.at ? -1 : 1);
    out += `<g class="node" tabindex="0" role="button" data-ids="${esc(ms.map(sid).join(" "))}" aria-label="${esc(l.n)}: ${ms.length} moment${ms.length === 1 ? "" : "s"}">` +
      `<text class="nl" x="4" y="${l.y - 1}">${esc(l.e)} ${esc(l.n.length > 21 ? l.n.slice(0, 20).replace(/\s+\S*$/, "") + "…" : l.n)}</text>` +
      `<text class="nc" x="4" y="${l.y + 11}">${ms.length} · ${KN[l.type]}</text>`;
    let x = X(ms[0].at), w = 2;
    ms.forEach((m, i) => { const nx = X(m.at); out += `<path class="t" data-ids="${esc(sid(m))}" d="M${x},${l.y} L${nx},${l.y}" stroke="${c}" stroke-opacity=".4" stroke-width="${w}"/>`; x = nx; w = Math.min(10, 2 + 0.6 * (i + 1)); });
    const end = l.dests.size ? DX : RX;
    out += `<path class="t" data-ids="${esc(ms.map(sid).join(" "))}" d="M${x},${l.y} L${end},${l.y}" stroke="${c}" stroke-opacity=".45" stroke-width="${w}"/>`;
    ms.forEach((m, i) => {
      const cx = X(m.at), cy = l.y + 18 * (m._row[l.key] || 0);
      out += `<g class="pt" data-ids="${esc(sid(m))}"><circle cx="${cx}" cy="${cy}" r="8" fill="var(--tint)" stroke="${c}" stroke-width="1.5"/>` +
        `<text x="${cx}" y="${cy + 3.5}" text-anchor="middle" font-size="9">${esc(m.g || "·")}</text>` +
        (m.flow ? `<circle cx="${cx + 6.5}" cy="${cy - 6.5}" r="2.6" fill="${KC.flow}" stroke="var(--tint)" stroke-width="1"/>` : "") +
        `<title>${esc(m.t)}${m.flow ? " · caught in " + esc(m.flow.n) : ""}</title></g>`;
    });
    out += `</g>`;
