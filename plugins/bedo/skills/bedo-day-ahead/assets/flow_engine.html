<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/*THEMEJS*/</script>
<title>How Things Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/*ROOT*/
/*NIGHT*/
/*SHELLCSS*/
.leannote{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.leannote b{color:var(--ink);font-weight:600}
#flow{display:block;min-width:860px;width:100%;height:auto}
/*BLOCKSCSS*/
.focus{margin-top:12px;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 14px}
.focus[hidden]{display:none}
.focus h3{margin:0 0 6px;font-size:15px}
.focus ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.focus li{font-size:13.5px}
.focus a{font:500 11px var(--mono);color:var(--dest);background:var(--dest-soft);border-radius:999px;padding:2px 9px;text-decoration:none;margin-left:6px}
.focus .when{font:500 11px var(--mono);color:var(--accent);margin-left:6px}
.int{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;margin:0 0 14px}
.three{background:var(--card);border:1px solid var(--rule);border-left:5px solid #B8860B;border-radius:14px;padding:12px 14px;margin:0 0 14px}
.three h2{font:italic 400 18px var(--serif);color:var(--accent);margin:0}
.three .how{font-size:12px;color:var(--muted);margin:2px 0 8px}
.three ol{margin:0;padding:0;list-style:none;counter-reset:t}
.three li{counter-increment:t;padding:9px 0 9px 30px;border-top:1px solid var(--rule);position:relative;cursor:pointer}
.three li:first-child{border-top:0}
.three li:before{content:counter(t);position:absolute;left:0;top:9px;width:20px;height:20px;border-radius:50%;background:#B8860B;color:#fff;font:600 12px/20px var(--mono);text-align:center}
.three li.done{opacity:.6}.three li.done:before{content:"✓";background:var(--k-flow,#5a8)}
.three .t{font-weight:600;display:block}
.three .why{display:block;font-size:13.5px;margin:2px 0 0}
.three .nx{display:block;font-size:13.5px;font-weight:600;margin:3px 0 0}
.three small{display:block;font:500 11.5px var(--mono);color:var(--muted);margin:3px 0 0}
.three .lks{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 0}.three .lk{font:500 12px var(--mono);padding:3px 8px;border:1px solid var(--rule);border-radius:999px;text-decoration:none;color:var(--accent)}
.three .then{font-size:12px;color:var(--muted);margin:8px 0 0}
.int h2{font:italic 400 18px var(--serif);color:var(--accent);margin:0}
.int .holds{font-size:15px;margin:4px 0 0}
.int .holds b{font-weight:600}
.int .how{font-size:12px;color:var(--muted);margin:2px 0 10px}
.int .fill{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.int .fill .bar{display:block;flex:1;height:10px;border-radius:5px;background:var(--rule);overflow:hidden;margin:0}
.int .fill .bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .2s}
.int .fill .bar i.over{background:var(--dest)}
.int .fill span{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.int ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.int li{display:flex;gap:8px;align-items:flex-start}
.int .pk{flex:1;text-align:left;font:14px/1.4 var(--sans);color:var(--ink);background:none;border:1px solid var(--rule);border-left:4px solid var(--dc);border-radius:10px;padding:6px 10px;cursor:pointer}
.int .pk[aria-pressed="true"]{background:var(--card2);border-color:var(--accent);border-left-color:var(--dc)}
.int .pk .rk{display:inline-block;min-width:1.6em;font:600 12px var(--mono);color:var(--muted)}
.int .pk[aria-pressed="true"] .rk{color:var(--accent)}
.int .pk small{display:block;font:500 10.5px var(--mono);color:var(--muted)}
.int .sz{font:500 11px var(--mono);color:var(--muted);background:var(--card2);border:1px dashed var(--rule);border-radius:999px;padding:4px 9px;cursor:pointer;white-space:nowrap;margin-top:4px}
.int .sz.set{border-style:solid;color:var(--ink)}
.int .k2{font:400 11.5px var(--mono);color:var(--faint);margin:8px 0 0}
/*BFCSS*/
/*BFCARDCSS*/
.td{margin:14px 0 18px}
.td .say{font:italic 500 clamp(22px,5.4vw,28px)/1.2 var(--serif);color:var(--accent);margin:2px 0 12px}
.td .say small{display:block;font:500 11px var(--mono);font-style:normal;color:var(--faint);letter-spacing:.04em;margin-bottom:4px}
.cal{position:relative;margin:0 0 0 46px;border-left:1px solid var(--rule)}
.cal .hr{position:absolute;left:-46px;right:0;border-top:1px solid var(--rule)}
.cal .hr span{position:absolute;left:0;top:-8px;width:40px;text-align:right;font:500 11px var(--mono);color:var(--faint)}
.cal .ev{position:absolute;border-radius:8px;padding:3px 8px;overflow:hidden;font-size:13px;line-height:1.25;border-left:4px solid var(--dc);background:color-mix(in srgb,var(--dc) 16%,var(--card));color:var(--ink)}
.cal .ev.event{background:color-mix(in srgb,var(--dc) 38%,var(--card));font-weight:600}
.cal .ev.done{opacity:.55}.cal .ev.done b{text-decoration:line-through}
.cal .ev b{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.cal .ev.event b{-webkit-line-clamp:3}.cal .ev i{display:block;font:500 10.5px var(--mono);font-style:normal;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev a{color:inherit;text-decoration:none}
.cal .band{position:absolute;left:3px;right:3px;border-radius:10px;border-left:4px solid var(--dc);background:color-mix(in srgb,var(--dc) 12%,transparent);z-index:0}
.bandtop{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0 0 8px;font-size:12px;color:var(--ink)}
.bandtop b{font:600 10.5px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.bandtop span{display:inline-flex;align-items:center;gap:5px}
.bandtop i{width:14px;height:11px;border-radius:3px;border:2px solid var(--dc);background:color-mix(in srgb,var(--dc) 16%,transparent)}
.bandtop a{color:inherit}
.cal .band span{position:absolute;right:8px;top:4px;font:600 11px var(--sans);color:var(--muted);text-align:right;max-width:55%}
.cal .ev{z-index:1}
.cal .ev.runner{z-index:0;opacity:.9}
.cal .ev.flash{box-shadow:0 0 0 3px var(--accent)!important;z-index:7}
.six{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:12px 14px;margin:0 0 16px}
.six h2{font:italic 400 20px var(--serif);color:var(--accent);margin:0 0 6px}
.six ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.six button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1.7em minmax(0,1fr) auto;gap:8px;align-items:baseline;width:100%;padding:5px 4px;border-radius:8px;cursor:pointer;font:15px/1.35 var(--sans);color:var(--ink)}
.six button:hover,.six button:focus-visible{background:var(--card2)}
.six .g{font-size:17px}.six .t{overflow-wrap:anywhere}.six .w{font:500 11.5px var(--mono);color:var(--muted)}
.sheet .chip.go{border:0;cursor:pointer;color:var(--dest);background:var(--dest-soft)}
.cal .band a{color:inherit;text-decoration:none}
.cal .ev .was{color:var(--accent)}
.cal .ev{background:color-mix(in srgb,var(--fill) 55%,var(--card));border-left-color:var(--edge)}
.cal .ev.lived{opacity:.92;padding:1px 6px;font-size:11.5px}
.cal .ev.lived b{-webkit-line-clamp:1;font-weight:500}
.cal .ev.lived i{display:none}
.cal .ev.lived.tall i{display:block}
.cal .ev.done b{text-decoration:none}
.cal .ev{cursor:pointer}
/* the card a tap opens (2 Nov 2026, her words: like the 28 Oct day ahead — I love the colors and the formatting,
   it's easy to read, easy to see what the important information is) */
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:20px 20px 0 0;box-shadow:0 -10px 34px rgba(0,0,0,.32);padding:14px 20px 30px;z-index:60;transform:translateY(105%);transition:transform .22s ease}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto 12px}
.sheet .sc{display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:4px 12px;border-left:5px solid var(--dc,var(--accent));padding:6px 0 6px 14px;border-radius:4px}
.sheet .at{font:500 13px var(--mono);color:var(--muted);padding-top:5px}
.sheet .ttl{font:600 1.32rem/1.25 var(--sans);color:var(--ink);overflow-wrap:anywhere}
.sheet .ttl .bx{display:inline-block;width:15px;height:15px;border:2px solid var(--accent);border-radius:4px;margin-right:6px;vertical-align:1px}
.sheet .ttl .bx.ok{background:var(--dest);border-color:var(--dest)}
.sheet .ttl .bolt{color:#E0A526;margin-right:6px}
.sheet .dv{grid-column:2;font:600 15px var(--sans);color:var(--dest)}
.sheet .nx{grid-column:2;font:600 15.5px/1.4 var(--sans);color:var(--ink);margin-top:6px;display:flex;gap:8px}
.sheet .nx::before{content:"→";color:var(--accent)}
.sheet .nx.none{color:var(--past);font-weight:500;font-size:14px}.sheet .nx.none::before{content:"?";color:var(--past)}
.sheet .lks{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sheet .lks a{font:500 13px var(--mono);color:var(--dest);background:var(--dest-soft);border-radius:999px;padding:4px 12px;text-decoration:none}
.sheet .wt{grid-column:2;color:var(--kid);font-size:14px;margin-top:4px}
.sheet .why{grid-column:2;font:400 15px/1.5 var(--sans);color:var(--muted);margin-top:8px}
.sheet .det{grid-column:2;font:400 14px/1.5 var(--sans);color:var(--muted);margin-top:8px;border-top:1px solid var(--rule);padding-top:8px}
.sheet .sq{display:inline-block;width:16px;height:16px;border-radius:4px;margin-right:8px;vertical-align:1px}
.sheet .when,.sheet .where{grid-column:2;font:400 15px/1.45 var(--sans);color:var(--ink);margin-top:4px}
.sheet .where a{color:var(--dest);text-decoration:none}
.cal .ev.gcal{background:var(--gc)!important;border:0!important;border-left:0!important;color:var(--gi,#fff)!important;opacity:1}
.cal .ev.gcal b,.cal .ev.gcal i{color:var(--gi,#fff)!important}
/* bright ahead, pastel behind (6 Nov 2026, her words: the bold things that are blocked out and scheduled in show up bold
   and bright ahead, and fade to a nice pastel when they're in the past) */
.cal .ev.gcal.past{opacity:1;background:color-mix(in srgb,var(--gc) 52%,#FBF8F4)!important;border-left:4px solid var(--gc)!important}
.cal .ev.gcal.past b,.cal .ev.gcal.past i,.cal .ev.gcal.past .ln,.cal .ev.gcal.past span{color:var(--ink)!important}
.cal .ev .dots{position:absolute;right:5px;bottom:3px;display:flex;gap:3px}.cal .ev .dots .wg{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:color-mix(in srgb,var(--card) 85%,transparent)}
/* the wellness glyphs sit furthest right, the photo just left of them (6 Nov 2026, her words) */
.cal .ev .rt{position:absolute;right:3px;top:3px;bottom:3px;display:flex;align-items:flex-end;gap:4px;pointer-events:none}
.cal .ev .rt .th{position:static;align-self:flex-start;height:calc(100% - 0px);max-height:48px}
/* a tall card with a photo: the photo at the top right, the glyphs at the bottom right, both against the edge */
.cal .ev.tall .rt,.cal .ev.event .rt{flex-direction:column;justify-content:flex-end}
.cal .ev.tall.hasph .rt,.cal .ev.event.hasph .rt{justify-content:space-between}
.cal .ev.hasph .rt .th{max-height:calc(100% - 24px)}
.cal .ev.tall .rt .th,.cal .ev.event .rt .th{align-self:flex-end;height:auto;width:44px;max-height:44px}
.cal .ev.tall.hasph,.cal .ev.event.hasph{padding-right:52px!important}
.cal .ev .rt .dots{position:static}
.cal .ev.hasph{padding-right:80px!important}

/* a card with a photo: the photo and the glyphs side by side, glyphs furthest right, both always inside the card (7 Nov 2026, her words: the wellness emoji always on it and always visible) */
.cal .ev.hasph .rt,.cal .ev.tall.hasph .rt,.cal .ev.event.hasph .rt{flex-direction:row;align-items:center;justify-content:flex-end;gap:4px}
.cal .ev.hasph .rt .th,.cal .ev.tall.hasph .rt .th,.cal .ev.event.hasph .rt .th{align-self:center;width:46px;height:46px;max-height:calc(100% - 2px);object-fit:cover;border-radius:6px}
.cal .ev.hasph .rt .dots{flex-direction:column;flex-wrap:wrap-reverse;max-height:100%;gap:2px;align-content:flex-end}
.cal .ev.hasph,.cal .ev.tall.hasph,.cal .ev.event.hasph{padding-right:76px!important}
/* night keeps the cards light and soft, with dark text (her words: in day they look beautiful) */
html[data-bedo="night"] .cal .ev:not(.gcal){background:color-mix(in srgb,var(--fill) 80%,#FBF8F4)!important}
html[data-bedo="night"] .cal .ev .dots .wg{background:#FBF8F4}
html[data-bedo="night"] .cal .ev:not(.gcal), html[data-bedo="night"] .cal .ev:not(.gcal) b, html[data-bedo="night"] .cal .ev:not(.gcal) i, html[data-bedo="night"] .cal .ev:not(.gcal) span, html[data-bedo="night"] .cal .ev.gcal.past b, html[data-bedo="night"] .cal .ev.gcal.past i{color:#2B2420!important}
/* sleep stays a dark night blue, never a pastel (6 Nov 2026, her words: what happened to my dark blue sleep) */
.cal .ev.slp,html[data-bedo="night"] .cal .ev.slp{background:#403F7B!important;border-left-color:#2A2960!important}
.cal .ev.slp,.cal .ev.slp b,.cal .ev.slp i,.cal .ev.slp span,html[data-bedo="night"] .cal .ev.slp b{color:#EEF0FA!important}
.cal .ev.lived.mom{outline:3px solid var(--k-moment,#F2C14E);outline-offset:0}
.cal .ev.gcal.past.star{opacity:1;outline:3px solid var(--k-moment,#F2C14E);outline-offset:0}
.cal .ev.combo .ln{display:block;font-size:12px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.combo .ths{display:flex;gap:3px;margin-top:4px}
.cal .ev.combo .ths img{width:40px;height:40px;object-fit:cover;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.cal .ev.combo{padding-right:8px}
.sheet .inside{margin:8px 0 0;padding-left:18px}
/* the list of what a combined card holds spans the panel's text column, never the narrow time column (7 Nov 2026) */
.sheet .sc .inside,.sheet .sc>.ph,.sheet .sc>a{grid-column:2}
.sheet .inside li{margin:0 0 6px}
.sheet .inside small{color:var(--muted)}
.cal .ev .th{position:absolute;right:3px;top:3px;bottom:3px;width:44px;max-height:48px;object-fit:cover;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.cal .ev.hasph{padding-right:52px}
.sheet .ph{display:block;width:100%;max-height:60vh;object-fit:contain;border-radius:8px;margin:8px 0 0}
.cal .ev .cov{display:block;font-size:11.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.session{border:2px solid var(--edge);border-left-width:5px;overflow:hidden}
.cal .ev.session .sl{display:block;font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.cal .ev.session .sl.more{color:var(--muted)}
.sheet ol.sess,.sheet ul.sess{margin:8px 0 0;padding-left:20px}
.sheet .sess li{margin:0 0 10px}
.sheet .sc .sess,.sheet .sc .det.sd{grid-column:1/-1}
.sheet .sess li small{display:block;color:var(--muted)}
.sheet details.sess summary{cursor:pointer;margin-top:6px;color:var(--muted)}
.sth{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 0 8px}
.sth h2{font:italic 400 22px var(--serif);color:var(--accent);margin:0}
.sth .fold{font:500 12px var(--mono);color:var(--dest);background:var(--dest-soft);border:0;border-radius:999px;padding:3px 11px;cursor:pointer}
.ftitle{font:italic 400 24px var(--serif);color:var(--accent);margin:28px 0 2px}
.fsub{font-size:13.5px;color:var(--muted);margin:0 0 10px;max-width:72ch}
.allsteps{margin:18px 0 0}.allsteps summary{cursor:pointer;font:500 13px var(--mono);color:var(--muted)}
.int .nf{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.int .nf li{display:block!important;border-left:4px solid var(--dc,var(--rule));background:var(--card);border-radius:8px;padding:6px 10px;font-size:14px;line-height:1.35;cursor:pointer}
.int .nf li small{display:block;font:500 11px var(--mono);color:var(--muted);margin-top:2px}
.int .nf li .st{color:var(--ink);font-weight:500}
.sheet .x{position:absolute;right:16px;top:10px;background:none;border:0;font-size:22px;color:var(--muted);cursor:pointer}
.cal .ev .more{display:none}.cal .ev.open .more{display:block;font-size:12.5px;line-height:1.4;margin-top:6px;color:var(--ink)}
.cal .ev .more .nx{display:block;font-weight:600;-webkit-line-clamp:unset}
.cal .ev .more .lks{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.cal .ev .more .lk{font:500 11.5px var(--mono);color:var(--dest);background:var(--dest-soft);border-radius:999px;padding:2px 10px;text-decoration:none}
.cal .ev .more .det{display:block;color:var(--muted);font-size:12.5px}
.cal .ev.open a.lk{pointer-events:auto}
.cal .ev.open{height:auto!important;min-height:46px;z-index:6;box-shadow:0 6px 18px rgba(0,0,0,.28);opacity:1}
.cal .ev.open b{display:block;-webkit-line-clamp:unset}.cal .ev.open i{display:block;white-space:normal}
.cal .ev.step{border:1.5px dashed var(--edge);border-left:4px solid var(--edge);background:color-mix(in srgb,var(--fill) 28%,var(--card))}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0 0 10px;font-size:11.5px;color:var(--muted)}
.legend b{font:600 10.5px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-right:-4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;background:var(--fill);border:1.5px solid var(--edge)}
.spc{padding:12px;display:grid;gap:12px}
/* the pie and the wheel side by side (7 Nov 2026, her words: the time pie chart and the wellness wheel right next to each other) */
/* the day's ring around the wheel (7 Nov 2026) */
.ring{margin:0}.ring svg{max-width:300px;margin:0 auto}.ring figcaption{text-align:center;font:500 11px var(--mono);color:var(--muted);margin-bottom:6px}.ring .wk{cursor:pointer}.ring .wk.dim{opacity:.2}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}.duo figure{margin:0;min-width:0}.duo svg{max-width:190px;margin:0 auto}
.duo figcaption{text-align:center;font:500 11px var(--mono);color:var(--muted);margin-bottom:4px}
.duo .wk{cursor:pointer}.duo .wk.dim{opacity:.2}
.spc svg{width:100%;height:auto;display:block}
.spl{display:grid;gap:5px}
.spr{display:grid;grid-template-columns:5.6rem minmax(40px,1fr) 3.6rem;gap:6px;align-items:center}
.spn{font-size:12.5px;line-height:1.15}
.spb{position:relative;display:block;height:9px;border-radius:5px;background:var(--card2)}
.spb i{display:block;height:100%;border-radius:5px;border:1.2px solid;box-sizing:border-box}
.spb em{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);border-radius:2px}
.spb em.lim{background:var(--past)}
.spv{font:500 11.5px var(--mono);color:var(--ink);text-align:right;line-height:1.1}
.spv small{display:block;font-size:9.5px;color:var(--muted)}
.spa{font:500 11px var(--mono);color:var(--muted);margin:0}

.mvc{padding:12px 14px;display:grid;gap:14px}
.mvr .mvn{font-weight:600;font-size:14.5px}
.mvb{display:flex;height:10px;border-radius:5px;background:var(--rule);overflow:hidden;margin:6px 0 4px}
.mvb i{display:block;height:100%;background:color-mix(in srgb,var(--dc) 55%,var(--card))}
.mvb i.t{background:var(--dc)}
.mvb i.p{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--dc) 35%,transparent) 0 4px,transparent 4px 8px)}
.mvl{font:500 12px var(--mono);color:var(--muted)}.mvl b{color:var(--ink)}
.legend-key{margin:0 0 10px}.legend-key summary{cursor:pointer;font:500 11.5px var(--mono);color:var(--muted)}.legend-key .legend{margin:8px 0 4px}

<body>
<main>
<p class="chip" id="chip"></p>

<div id="flowwrap"><details class="allsteps"><summary>every step, by rhythm</summary><div class="blocks" id="blocks"></div></details>
<h2 class="ftitle">How things flow</h2>
<p class="fsub">today's steps → the drives they serve → the rhythms → ☸️ the wellness wheel, and on to where each drive leads. Tap anything to follow it.</p>
<div class="card"><div class="scroll"><svg id="flow" role="img" aria-label="Steps flowing into drives, rhythms, the wellness wheel and destinations"></svg></div>

<p class="hint">each list runs from the easiest next step · tap anything on the flow to follow it · tap again to see all</p></div>

</main>
<script>/*BFJS*/</script>
<script>
/* the theme button: plain line icons, a sun or a moon (7 Nov 2026, her words: just the white outline, very simple, clean glyphs) */
const D = /*DATA*/;
/*BASICSJS*/
if(D.quest){const q=document.getElementById('questlink'),a=document.createElement('a');a.href=D.quest.u;a.target='_blank';a.rel='noopener';a.textContent=D.quest.t;q.appendChild(a);q.hidden=false;}

/* how today leans (29 Oct 2026, her words: there is the tending, the taking care of things, and then
   there is the growing, the pushing, the drive — different actions, and some days I may want to do the
   min of one and the max of the other, so the system needs to be responsive to that).
   tending day: every tending step; each drive rests to one line.
   balanced: the easiest next step on each rhythm and each drive (no stars, her words 29 Oct 2026).
   growing day: tending only where something is due today; each drive opens to its next few steps.
   It starts from the morning's secure base: knocked back leans to tending. */
const LEAN = {tend:{rh:4, dr:0}, bal:{rh:1, dr:1}, grow:{rh:'due', dr:4}};
/* be•do chooses the lean (29 Oct 2026, her words: I'd rather that you could choose for me based on my
   readiness and general sense of how caught up I am, how I'm feeling). Read off the day, never guessed:
   the morning Oura readiness (80 and up leans to growing, under 70 to tending), the secure base (knocked
   back leans to tending), and how caught up she is (three or more tending things past their date leans
   to tending). How she's feeling joins this once the morning carries it.
   No switch and no week or month view (29 Oct 2026, her words): just today, and the next right step
   made very clear — what is actionable. */
/* the morning card chooses first (29 Oct 2026): optimal leans to growing, good to balanced, pay attention
   to tending; a knocked-back secure base still pulls to tending. Without the card, the readiness rule below. */
/*BFCARDJS*/
function chooseLean(){
  if(BFV!=null){ const st=BedoBaseFlow.state(BFV), why=[`the morning card ${BFV}, ${st}`];
    let l = st==='optimal'?'grow':st==='good'?'bal':'tend';
    if(D.secure && D.secure!=='secure'){ l='tend'; why.push('knocked back this morning'); } else if(D.secure) why.push('secure base');
    return {lean:l, why}; }
  const R=D.ready||{}, why=[]; let s=0;
  if(R.readiness!=null){ if(R.readiness>=80){ s+=1; why.push(`readiness ${R.readiness}`); } else if(R.readiness<70){ s-=1; why.push(`readiness ${R.readiness}, low`); } else why.push(`readiness ${R.readiness}`); }
  else why.push('no readiness yet this morning');
  if(D.secure && D.secure!=='secure'){ s-=2; why.push('knocked back this morning'); } else if(D.secure) why.push('secure base');
  if((R.late_tend||0)>=3){ s-=1; why.push(`${R.late_tend} tending things past their date`); }
  else if(R.late_tend) why.push(`${R.late_tend} tending ${R.late_tend===1?'thing':'things'} a little behind`);
  else why.push('caught up on tending');
  return {lean: s>=1?'grow':s<=-1?'tend':'bal', why};
}
const CHOSEN = chooseLean();
const lean = CHOSEN.lean, win = 0;
let cur=null, part={};
const note = {tend:'a tending day · taking care of things first; the drives rest',
              bal:'balanced · one step to tend on each rhythm, one to grow on each drive',
              grow:'a growing day · tending kept to what is due today; the drives open up'};

function ease(a){ return (a.dl?4:0)+(a.mo?3:0)+((a.links||[]).length?2:0)+(a.today?1:0); }
function whyOf(a){ const w=[]; if(a.dl) w.push('its deliverable is on it · done?'); if(a.mo) w.push('already in motion');
  if((a.links||[]).length) w.push('its chat or file is linked'); if(a.today) w.push('today'); else if(a.d) w.push(fmt(a.d)); return w; }
const byEase=(a,b)=>ease(b)-ease(a)||(a.d||'9').localeCompare(b.d||'9');

// the shape: each rhythm, its own steps to tend, and the drives under it (a drive whose rhythm is unknown sits apart)
function shape(){
  const end=plus(D.day,win), inWin=a=>a.today||(a.d&&a.d<=end);
  const doneBy={}; (D.done||[]).forEach(x=>{ (doneBy[x.rd]=doneBy[x.rd]||[]).push({t:x.t,done:true,today:true}); });
  const L=LEAN[lean];
  const keep=(acts,n)=>{ const open=acts.filter(a=>!a.done).sort(byEase); open.forEach(a=>a.pick=false); if(open[0]) open[0].pick=true;
    const shown = n==='due' ? open.filter(a=>a.today).slice(0,2) : open.slice(0,n);
    return {shown, open}; };
  const known=new Set(D.order);
  const blocks=D.order.map(r=>{ const R=D.rhythms.find(x=>x.n===r); if(!R) return null;
    const tend=keep(R.acts.filter(inWin), L.rh);
    const drives=D.drives.filter(d=>d.parent===r).map(d=>({d, ...keep(d.acts.filter(inWin), L.dr), done:doneBy[d.n]||[]})).filter(x=>x.open.length||x.done.length);
    return {R, ...tend, done:doneBy[R.n]||[], drives}; }).filter(b=>b&&(b.open.length||b.drives.length||b.done.length));
  const loose=D.drives.filter(d=>!known.has(d.parent)).map(d=>({d, ...keep(d.acts.filter(inWin), L.dr), done:doneBy[d.n]||[]})).filter(x=>x.open.length||x.done.length);
  if(loose.length) blocks.push({R:{n:'',short:'drives with no rhythm yet',g:'',c:'clay'}, shown:[], open:[], done:[], drives:loose, loose:true});
  return blocks;
}
function stepLine(a){ return `<p class="st">${a.done?'✅ ':'→ '}${esc(a.t)}</p><div class="why">${a.done?'<span>done today</span>':whyOf(a).map(w=>`<span>${esc(w)}</span>`).join('')}${(a.links||[]).map(l=>`<a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.l)} ↗</a>`).join('')}</div>`; }
function lists(blocks){
  const when='today';
  document.getElementById('leannote').innerHTML = `<b>be•do chose ${lean==='grow'?'a growing day':lean==='tend'?'a tending day':'balanced'}</b> · ${esc(CHOSEN.why.join(' · '))}<br>${note[lean]}`;
  document.getElementById('blocks').innerHTML=blocks.map(b=>{
    const R=b.R, tendHtml = b.loose ? '' :
      (b.done.length||b.shown.length ? `<p class="k">tend</p>${b.done.map(a=>stepLine(a)).join('')}${b.shown.map(a=>stepLine(a)).join('')}${b.open.length>b.shown.length?`<p class="st more">+${b.open.length-b.shown.length} more to tend</p>`:''}`
       : b.open.length ? `<p class="rest">${b.open.length} to tend, resting ${when}</p>` : '');
    const drv=b.drives.map(x=>{ const g=D.goals[x.d.n]||'';
      const body = x.shown.length||x.done.length ? `${x.done.map(a=>stepLine(a)).join('')}${x.shown.map(a=>stepLine(a)).join('')}${x.open.length>x.shown.length?`<p class="st more">+${x.open.length-x.shown.length} more on it</p>`:''}`
        : `<p class="rest">resting ${when} · ${x.open.length} ${x.open.length===1?'step':'steps'} waiting</p>`;
      return `<div class="dr" style="--dc2:${col(x.d.c)}"><div class="dn">${esc((x.d.g||'')+' '+(x.d.short||x.d.n))}</div>${g&&(x.shown.length||lean!=='tend')?`<div class="gl">${esc(g)}</div>`:''}${body}</div>`; }).join('');
    return `<section class="rb" style="--dc:${col(R.c)}"><h2>${esc((R.g||'')+' '+(R.short||R.n))}${b.loose?'':'<span class="to">→ ☸️ the wellness wheel</span>'}</h2>${tendHtml}${drv?`${b.loose?'':'<p class="k">grow</p>'}${drv}`:''}</section>`;
  }).join('');
}

// the flow: steps → drives → rhythms → the wheel; each drive also on to its destinations
function flow(blocks){
  const svg=document.getElementById('flow'); svg.textContent=''; cur=null; part={}; document.getElementById('focus').hidden=true;
  const ROW=24, TOP=34, GAP=12, X0=12, XS=330, XD=500, XR=680, XO=860;
  const reg=(k,e)=>{(part[k]=part[k]||[]).push(e);};
  const rows=[], drs=[], rhs=[];
  let y=TOP;
  blocks.forEach(b=>{ const y0=y, R=b.R;
    const own=[...b.done,...b.shown].map(a=>({a,to:'r'}));
    own.forEach(s=>{ s.y=y+ROW/2; rows.push({...s,b}); y+=ROW; });
    b.drives.forEach(x=>{ const dy0=y; const acts=[...x.done,...x.shown]; acts.forEach(a=>{ rows.push({a,to:'d',x,b,y:y+ROW/2}); y+=ROW; });
      if(!acts.length){ y+=ROW*.75; } x.y0=dy0; x.y1=y; x.ym=(dy0+y)/2; drs.push({x,b}); });
    b.y0=y0; b.y1=y; b.ym=(y0+y)/2; if(!b.loose) rhs.push(b); y+=GAP; });
  const dests={}; drs.forEach(({x})=>x.d.dest.forEach(n=>{ (dests[n]=dests[n]||[]).push(x); }));
  const H=Math.max(y, TOP+60+Object.keys(dests).length*34)+10; svg.setAttribute('viewBox',`0 0 1000 ${H}`);
  [['steps',X0,'start'],['drives',XD+10,'start'],['rhythms',XR+10,'start'],['what they rest on · where they lead',XO,'start']].forEach(([t,x,a])=>T(t,{x,y:20,'font-family':MONO,'font-size':11,fill:cv('--muted'),'text-anchor':a},svg));
  const G={b:S('g',{},svg),n:S('g',{},svg)};
  // the wheel, the foundation, at the top of the last column; the destinations under it

  for(const k of Object.keys(WDOM).sort((x,y)=>B[y]-B[x])){ const v=B[k]||0; if(!v) continue;

/* how the drives move today (7 Nov 2026, her words: I really love how the 30 Oct version shows the actual progress;
   looking out ahead I can see how it moves, and looking back behind I can see how it moved). Each drive with a step
   today: the share of its steps done before today, what today closed, and what today still holds. */
function moved(){
  const el=document.getElementById('moved'); if(!el) return;
  const over=new Date().toLocaleDateString('en-CA')>D.day, pc=(a,t)=>t?Math.round(100*a/t):0;
  const planned={}; (D.schedule||[]).forEach(x=>{ if(x.k==='step'&&!x.done&&!x.session&&x.drive) planned[x.drive]=(planned[x.drive]||0)+1; });
  const rows=(D.drives||[]).filter(d=>d.prog&&(d.prog.today||planned[d.n])&&!(D.hidden||[]).includes(d.n)).map(d=>{
    const p=d.prog, tot=(p.done||0)+(p.open||0), before=Math.max(0,(p.done||0)-(p.today||0)), plan=over?0:(planned[d.n]||0);
    const now=pc(p.done,tot), was=pc(before,tot), to=pc((p.done||0)+plan,tot);

                    :(p.today?`<b>${now}%</b> · +${now-was}% so far today`:`<b>${now}%</b>`)+(plan?` · today's step${plan>1?'s take':' takes'} it to ${to}%`:'');
    return `<div class="mvr" style="--dc:${col(d.c)}"><div class="mvn">${esc((d.g||'')+' '+(d.short||d.n))}</div>`
      +`<div class="mvb"><i style="width:${was}%"></i><i class="t" style="width:${now-was}%"></i><i class="p" style="width:${to-now}%"></i></div>`

}
/* how the time went, as a pie of the whole 24 hours (7 Nov 2026, her words: an updated graphic like the day behind's that
   matches those categories; then: instead of this list, a pie chart, and 24 hours has to be the total). Every minute of
   the day goes somewhere: to the kinds of the lived cards that cover it, shared equally when two kinds overlap (a meal
   eaten during a long stretch of work is half each), and otherwise to not logged, or, on a day still going, to still
   ahead. A moment, or a row with no span of its own, takes no minutes. */
function spent(){
  const el=document.getElementById('spent'); if(!el||!window.__chc) return;
  const mm=t=>{ const [h,m]=String(t).split(':').map(Number); return h*60+m; };
  const now=new Date(), today=now.toLocaleDateString('en-CA')===D.day, ahead0=today?now.getHours()*60+now.getMinutes():1440;
  const iv=[]; (D.schedule||[]).forEach(x=>{ if(!(x.k==='lived'||(x.k==='event'&&x.done&&x.cat&&x.cat!=='event'))||x.pt||x.nopie||x.cat==='moment') return;
    const k=window.__chc(x), a=Math.max(0,mm(x.a)), b=Math.min(1440,mm(x.b)); if(b>a) iv.push([a,b,k,x.dev||null]); });
  if(!iv.length){ el.innerHTML=''; return; }
  const fl=(D.schedule||[]).filter(x=>x.flowcard).map(x=>[Math.max(0,mm(x.a)),Math.min(1440,mm(x.b)||1440),window.__chc(x)]);
  const by={}, scr={};
  for(let m=0;m<1440;m++){
    const ks=[...new Map(iv.filter(v=>v[0]<=m&&m<v[1]).map(v=>[v[2][2],v[2]])).values()];
    /* screen time across the day, each device once a minute */
    new Set(iv.filter(v=>v[0]<=m&&m<v[1]&&v[3]).map(v=>v[3])).forEach(d=>{ scr[d]=(scr[d]||0)+1; });
    if(ks.length) ks.forEach(k=>{ (by[k[2]]=by[k[2]]||{n:k[2],c:k[0],m:0}).m+=1/ks.length;
      /* the minutes of this kind that were on a screen, by device (8 Nov 2026) */
      const d=(iv.find(v=>v[0]<=m&&m<v[1]&&v[2][2]===k[2]&&v[3])||[])[3]; if(d){ const o=by[k[2]].dev=by[k[2]].dev||{}; o[d]=(o[d]||0)+1/ks.length; } });

    /* a minute inside her dawn or dusk flow with no card of its own is the flow's (11 Nov 2026, her question: why does it
       still show 4 hours of not logged — the flow's steps are moments with no span, so its whole run counted as a gap) */
    else if(m<ahead0&&fl.some(f=>f[0]<=m&&m<f[1])){ const k=fl.find(f=>f[0]<=m&&m<f[1])[2]; (by[k[2]]=by[k[2]]||{n:k[2],c:k[0],m:0}).m+=1; }
    else { const n=m>=ahead0?'still ahead':'not logged'; (by[n]=by[n]||{n,c:m>=ahead0?'transparent':'var(--rule)',m:0,gap:true}).m+=1; }
  }
  /* whole minutes that still add up to exactly 24 h: floor each, then the largest remainders take the minutes left */
  const all_=Object.values(by).map(r=>({...r,f:r.m,m:Math.floor(r.m)})), left=1440-all_.reduce((a,r)=>a+r.m,0);
  all_.slice().sort((p,q)=>(q.f-q.m)-(p.f-p.m)).slice(0,left).forEach(r=>{ r.m+=1; });
  const rows=all_.filter(r=>r.m>0);
  const order=r=>/^sleep/.test(r.n)?0:r.gap?2:1;
  rows.sort((p,q)=>order(p)-order(q)||q.m-p.m);
  const hm=m=>m>=60?`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`:`${m} min`;
  const R=117, r0=99, C=120, arc=(a0,a1)=>{ const P=(a,rr)=>[C+rr*Math.sin(a),C-rr*Math.cos(a)], big=a1-a0>Math.PI?1:0, [x0,y0]=P(a0,R),[x1,y1]=P(a1,R),[x2,y2]=P(a1,r0),[x3,y3]=P(a0,r0);
    return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 ${big} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}A${r0} ${r0} 0 ${big} 0 ${x3.toFixed(1)} ${y3.toFixed(1)}Z`; };
  let at=0; const segs=rows.map(r=>{ const a0=at/1440*2*Math.PI, a1=(at+r.m)/1440*2*Math.PI; at+=r.m;
    const fill=r.gap?(r.n==='still ahead'?'none':'var(--rule)'):`color-mix(in srgb,${r.c} 60%,var(--card))`;
    return `<path${r.gap?'':` class="kseg${KF&&KF!==r.n?' off':''}" data-n="${esc(r.n)}"`} d="${arc(a0,Math.min(a1,a0+2*Math.PI-1e-4))}" fill="${fill}" stroke="${r.gap?'var(--rule)':r.c}" stroke-width="1"${r.n==='still ahead'?' stroke-dasharray="3 3"':''}><title>${esc(String(r.n).split(' · ')[0])} · ${hm(r.m)}</title></path>`; }).join('');
  const over=now.toLocaleDateString('en-CA')>D.day;
  /* the running bars under the pie, each against its goal (7 Nov 2026, her words: the pie chart with the running categories
     underneath, because that's actually very useful, and show what the goal is — sleep 8 hours, work 4, movement 2, food 1).
     The goals are hers, `time_goals` in her settings: hours by the kind's first word */
  /* goals can be by the shape of the day (7 Nov 2026, her words: an ideal weekday is probably 7 hours of sleep, 4 of work,
     4 of care, 2 of movement, 2 of food): `weekday`, `saturday`, `sunday`, else one set for every day */
  const dow=new Date(D.day+'T12:00:00Z').getUTCDay(), shape_=dow===0?'sunday':dow===6?'saturday':'weekday';
  const pick=o=>o&&(o.weekday||o.saturday||o.sunday)?(o[shape_]||{}):(o||{});
  const G=pick(D.timegoals), X=pick(D.timelimits), key=(o,r)=>o[String(r.n).split(' · ')[0]]??o[String(r.n).split(' ')[0]];
  const goal=r=>{ const h=key(G,r); return h?h*60:0; }, limit=r=>{ const v=key(X,r); return v?[].concat(v).map(h=>h*60):[]; };
  const scrTot=Object.values(scr).reduce((a,b)=>a+b,0), meas=D.screen_measured||0;
  const top=Math.max(...rows.filter(r=>r.n!=='still ahead').map(r=>Math.max(r.m,goal(r),...limit(r))),scrTot,meas,60);
  /* screens, in her device words (8 Nov 2026, her words: the mobile, the phone, the Chromebook, the laptop, a TV) */
  const DEV={phone:['📱','#4A5A8C'],chromebook:['⌨️','#2E7D7A'],laptop:['💻','#7A5C99'],tv:['📺','#B5651D'],'work desktop':['🖥️','#5A5A5A']};
  const dv=d=>DEV[d]||['▪︎','#777'];
  const hatch=c=>`repeating-linear-gradient(135deg,${c} 0 3px,color-mix(in srgb,${c} 35%,transparent) 3px 6px)`;
  const devBar=(o,base)=>{ let at=0; return Object.entries(o||{}).sort((p,q)=>q[1]-p[1]).map(([d,m])=>{ const w=100*m/top, h=`<b class="dv" style="left:${at}%;width:${w}%;background:${base?dv(d)[1]:hatch(dv(d)[1])}" title="${esc(d)} ${hm(Math.round(m))}"></b>`; at+=w; return h; }).join(''); };
  const devLine=o=>Object.entries(o||{}).filter(e=>e[1]>=1).sort((p,q)=>q[1]-p[1]).map(([d,m])=>`${dv(d)[0]} ${hm(Math.round(m))}`).join(' · ');
  const short=n=>String(n).split(' · ')[0].replace(' and life admin',' & admin').replace(' and ',' & ');
  const lg=rows.filter(r=>r.n!=='still ahead').map(r=>{ const g=goal(r), lim=limit(r), fill=r.gap?'var(--rule)':`color-mix(in srgb,${r.c} 60%,var(--card))`;
    const note=g?`of ${hm(g).replace(' 00','')}`:lim.length?`≤ ${lim.map(m=>String(m/60)).join('–')} h`:'';
    const dl=devLine(r.dev);
    return `<div class="spr${r.gap?'':KF===r.n?' on':KF?' off':''}"${r.gap?'':` data-n="${esc(r.n)}"`}><span class="spn">${esc(short(r.n))}${dl?`<small class="spd">${dl}</small>`:''}</span><span class="spb"><i style="width:${Math.max(2,100*r.m/top)}%;background:${fill};border-color:${r.gap?'var(--muted)':r.c}"></i>${devBar(r.dev)}${g?`<em style="left:${100*g/top}%"></em>`:''}${lim.map(m=>`<em class="lim" style="left:${100*m/top}%"></em>`).join('')}</span><span class="spv">${hm(r.m)}${note?`<small>${note}</small>`:''}</span></div>`; }).join('')
    +(by['still ahead']?`<p class="spa">${hm(rows.find(r=>r.n==='still ahead').m)} still ahead</p>`:'')
    /* on a screen, all day, by device, beside what the phone itself measured (8 Nov 2026: measured beats logged) */
    +(scrTot||meas?`<div class="spr scr"><span class="spn">on a screen<small class="spd">${devLine(scr)||'none logged'}</small></span><span class="spb">${devBar(scr,true)}${meas?`<em class="meas" style="left:${Math.min(100,100*meas/top)}%" title="phone, measured"></em>`:''}</span><span class="spv">${hm(scrTot)}${meas?`<small>📱&nbsp;${hm(meas).replace(/ /g,'&nbsp;')}<br>measured</small>`:''}</span></div>`:'');
  if(KF&&!rows.some(r=>r.n===KF)) KF='';
  const tip=KF?`<p class="spk">showing <b>${esc(short(KF))}</b> on the wheel and the timeline below · <a href="#" id="kclr">show all</a></p>`
               :(WF?`<p class="spk">showing <b>${esc(WF)}</b> on the timeline below · <a href="#" id="kclr">show all</a></p>`:`<p class="spk">tap a kind, or a glyph on the wheel, to light it up on the timeline</p>`);
  el.innerHTML=`<h2 class="ftitle">${over?'how the time went':'how the time is going'}</h2><div class="card spc"><div class="spl">${lg}${tip}</div><figure class="ring"><figcaption>the day's 24 hours around ☸️ the wheel</figcaption><svg viewBox="0 0 240 240" role="img" aria-label="the day's 24 hours by kind, around today's wellness wheel">${segs}<g id="wslot" transform="translate(20 20)"></g></svg></figure></div>`;
  el.querySelectorAll('[data-n]').forEach(n=>n.addEventListener('click',()=>pickKind(n.dataset.n)));
  const c=document.getElementById('kclr'); if(c) c.onclick=e=>{e.preventDefault(); if(KF) pickKind(KF); else pickEl(WF);};
}
/* one kind of time, followed through the page (7 Nov 2026, her words: when I click on something in the how I'm spending
   my time widget, it highlights those things in the timeline and the wellness wheel). A tap on a kind in the pie or its
   bars lights that kind's cards on the timeline (the rest fade) and the wheel's elements its rows fed, with the rows
   listed under the wheel; a second tap, or show all, puts everything back. */
let KF='';
const kindOf=x=>window.__chc&&x?window.__chc(x)[2]:'';
function kindRows(){ const S=(D.schedule||[]).filter(x=>(x.k==='lived'||(x.k==='event'&&x.done&&x.cat&&x.cat!=='event'))&&kindOf(x)===KF);
  const rids=new Set(), els=new Set(); S.filter(x=>!x.flowcard).forEach(x=>{ if(x.rid) rids.add(x.rid); (x.rids||[]).forEach(r=>rids.add(r)); [x.el,x.el2].forEach(e=>{ if(e) els.add(e); }); });
  return {rids,els}; }
function markTimeline(){ document.querySelectorAll('#today .ev[data-c]').forEach(n=>{ const x=(window.__cards||[])[+n.dataset.c];
  const on=!!(KF||WF), hit=on&&(KF?kindOf(x)===KF:!!x&&(x.el===WF||x.el2===WF)); n.classList.toggle('klit',hit); n.classList.toggle('kdim',on&&!hit); }); }
function pickKind(n){ KF=KF===n?'':n; WF=''; spent(); wheel(); markTimeline(); }
function pickEl(k){ WF=WF===k?'':k; KF=''; spent(); wheel(); markTimeline(); }
/* a Saturday's things she might want to do (7 Nov 2026, her words: I really want you to try harder to pull up all the
   things that I might want to do on Saturday, because this is a very short list): fun first and easy first, each with its
   way in and no clock; her intention leads it */
function sat(){
  /* less to take in (7 Nov 2026, her words: the things you might like card is the start of something good but it's
     overwhelming the way it is … your top three suggestions … and an expandable list: are you wanting to watch a movie?
     here's the movies in your queue; do you want to read a book? do something fun? an urban adventure or an outdoor
     adventure? grouping the things according to energy and distance and practicality). Three to start, then each mood
     folded, from the least energy and the closest to home out to the farthest; the few with the most pull fold last. */
  const el=document.getElementById('sat'), G=D.ideas||[], I=D.intentions||[];
  if(!G.length){ el.innerHTML=''; return; }
  const lk=x=>(x.links||[]).length?`<span class="lks">${x.links.map(l=>`<a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.l||'link')} ↗</a>`).join('')}</span>`:'';
  const li=x=>`<li><b>${esc(x.t)}</b>${x.when?`<span class="w">${esc(x.when)}</span>`:''}${x.on?'<span class="on">started</span>':''}${x.why?`<p>${esc(x.why)}</p>`:''}${(x.also||[]).length?`<p>also: ${x.also.map(esc).join(' · ')}</p>`:''}${lk(x)}</li>`;
  const list=(xs,n)=>`<ul>${xs.slice(0,n).map(li).join('')}</ul>${xs.length>n?`<details><summary>${xs.length-n} more</summary><ul>${xs.slice(n).map(li).join('')}</ul></details>`:''}`;
  const grp=g=>(G.find(x=>x.g===g)||{}).items||[];
  const stories=(G.find(x=>x.g==='stories')||{}).moods||[];
  const kid=(stories.find(m=>m.m==='kid')||{}).label||'';
  const watch=[], read=[], gate=D.media_gate;
  /* with her Morning Gate named, its stories and media stay there and this links to it (7 Nov 2026, her words: I'd prefer to
     see all of the stories / media stuff on my morning gate and just link to it); without it, each keeps its kind's glyph */
  if(!gate) stories.forEach(m=>m.items.forEach(x=>{ const it={...x,why:x.why||(m.m==='kid'?m.label:m.m==='learn'?'learn something':'')};
    (/📗|🎧|🎙/.test(x.kind||'')?read:watch).push({...it,t:(x.kind?x.kind+' ':'')+x.t}); }));
  [watch,read].forEach(xs=>xs.sort((p,q)=>(q.on?1:0)-(p.on?1:0)));
  const OUT=/\b(trails?|park|lake|ranch|river|falls|preserve|gardens?|hike|hiking|walk|zoo|camp\w*|picnic|dogs?|outdoor|nature|bosque)\b/i;
  const out=grp('out'), outdoors=out.filter(x=>OUT.test(x.t+' '+(x.why||''))), town=out.filter(x=>!outdoors.includes(x));
  const home=grp('home'), people=grp('people'), soon=grp('soon');
  /* three to start: what is dated today, something easy at home, something outside — else the next nearest. Something on
     another day is never one of today's three (7 Nov 2026, her words: the Spirits of Erath County walk should not be
     showing up on my Saturday my day — it is Sunday's); it waits folded under coming up */
  const three=[], took=new Set(), today_=soon.filter(x=>/^today\b/.test(x.when||''));
  const DOW=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'], dow=DOW[new Date(D.day+'T12:00:00Z').getUTCDay()];
  const otherDay=o=>(o.when&&!/^today\b/.test(o.when))||DOW.some(d=>d!==dow&&new RegExp('\\b'+d+'\\b','i').test(o.t));
  for(const xs of [today_,home,outdoors,town,watch,people,read,grp('day')]){ const x=xs.find(o=>!took.has(o)&&!otherDay(o)); if(x&&three.length<3){ three.push(x); took.add(x); } }
  const rest=xs=>xs.filter(x=>!took.has(x));
  const MENU=[['🛋️','watch something','low energy · at home',rest(watch)],
              ['📖','read or listen','low energy · anywhere',rest(read)],
              ['🏡','something fun at home','a little energy · at home',rest(home)],
              ['💬','call or see someone','a little energy',rest(people)],
              ['🏙️','an urban adventure','some energy · in town',rest(town)],
              ['🌳','an outdoor adventure','some energy · close to home',rest(outdoors)],
              ['📅','coming up','has a date',rest(soon)],
              ['🚗','a day out','a full day · a drive',rest(grp('day'))],
              ['🗺️','fun to plan','for later',rest(grp('plan'))],
              ['✈️','farther off, to dream on','far',rest(grp('far'))]].filter(m=>m[3].length);
  if((D.feel||[]).length) MENU.push(['⚡','if you feel like it','the few with the most pull',D.feel]);
  const gateLink=gate?`<p class="gate"><a href="${esc(gate)}" target="_blank" rel="noopener">🗞️ watch, read or listen · your Morning Gate ↗</a></p>`:'';
  el.innerHTML=(I.length?`<p class="say"><small>your intention</small>${I.map(esc).join('<br>')}</p>`:'')
    +`<h2>for a Saturday</h2><p class="sub">three to start · or open what you're in the mood for · nothing here has a time</p>`
    +`<ul>${three.map(li).join('')}</ul>`
    +gateLink+`<div class="menu">${MENU.map(([g,t,h,xs])=>`<details><summary>${g} ${esc(t)} <span class="n">${xs.length}</span><small>${esc(h)}</small></summary>${list(xs,6)}</details>`).join('')}</div>`;
}
/* the page's order follows the day (7 Nov 2026, her words: I like to see the base flow up at the top early in the day,
   but then drop it down to the very bottom in the afternoon; what I want to see at the top is the how the time is going
   viz; and how I'm spending my time and the wellness wheel balance throughout the day with the timeline below). Before
   noon base flow leads; from noon, and on a day already gone, the time and the wheel lead with the timeline under them,
   and base flow closes the page. */
function arrange(){
  const $=id=>document.getElementById(id), m=$('h1'); if(!m) return;
  const now=new Date(), day=now.toLocaleDateString('en-CA'), am=day<D.day||(day===D.day&&now.getHours()<12);
  const after=['spent','wheel','today','sat','int','flowwrap','moved'], base=['rv','leannote'];
  /* the three sit right under base flow in the morning, and right under the day's time from noon (12 Nov 2026). Before
     10 the calendar comes straight after the three and how the time is going waits at the bottom (12 Nov 2026, her words:
     how the time is going is pretty irrelevant at this stage in the day … till after my work day has started … after 10
     o'clock; this is where it's helpful to see the calendar) */
  const early=day===D.day&&now.getHours()<10;
  const ids=early?['rv','three','leannote','today','sat','int','flowwrap','moved','spent','wheel']
    :am?['rv','three','leannote'].concat(after):['spent','wheel','three'].concat(after.slice(2),base);
  let at=m; ids.forEach(id=>{ const n=$(id); if(n){ at.after(n); at=n; } });
}
function draw(){ sat(); today(); card(); three(); const b=shape(); lists(b); intention(b); flow(b); spent(); moved(); wheel(); markTimeline(); arrange(); }
document.addEventListener('bedo-theme',draw);
draw();

<script>
/* download HTML (261106_download, her words 6 Nov 2026: on the day behind, I'd like to be able to download that as an
   HTML … I like saving the tokens): the page saves itself as one .html, photos and all, at her click — no storage, no
   connector, no tokens. In claude.ai the viewer's own save prompt (the `downloads` capability, declared at publish);
   anywhere else, a plain Blob download. What the page drew for this viewer is left out, so the copy draws itself
   fresh when it is opened. */
(function(){
  function src(){ var h=document.documentElement.cloneNode(true);
    h.querySelectorAll('[data-dyn],#sheet,#bedo-dl').forEach(function(n){ n.remove(); });
    return '<!doctype html>\n'+h.outerHTML; }
  function name(){ var t=(document.title||'').replace(/[^A-Za-z0-9 ._-]+/g,' ').replace(/\s+/g,' ').trim(); return (t||'be-do page')+'.html'; }
  function blob(){ var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([src()],{type:'text/html'})); a.download=name();
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500); }
  var b=document.createElement('button'); b.id='bedo-dl'; b.type='button'; b.textContent='\u2913 download this page'; b.title='save this page as one .html file';
  b.style.cssText='display:block;margin:28px auto 8px;font:500 12px ui-monospace,Menlo,monospace;color:inherit;opacity:.75;background:none;border:1px solid currentColor;border-radius:999px;padding:5px 14px;cursor:pointer';
  b.onclick=function(){
    var c=window.claude; if(!c||!c.use){ blob(); return; }
    c.use('downloads').then(function(d){
      if(!d){ blob(); return; }
      return d.save({filename:name(), data:new Blob([src()],{type:'text/html'})}).catch(function(e){
        if(e&&/^(unavailable|not_granted|capability_disabled|capability_removed)$/.test(e.code)) blob(); });
    }, blob); };
  (document.querySelector('main')||document.body).appendChild(b);
})();
</script>
</body>
</html>
