<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<style>
/* The Stories page, the Morning Gate's sibling: the same type and palette, made for images.
   Pick back up (big cards) · today's rhythm · Watch by who and mood · one shelf per app · Done this week.
   Status shows in form: gold is waiting, river blue is started, green is finished. */
:root {
  --bg: #f2f4f5; --card: #ffffff; --ink: #142028; --soft: #5b6870; --line: #e0e5e8;
  --river: #1d6a8a; --river-tint: #e2eef3; --next: #c27a17; --next-tint: #f7edde;
  --done: #3f8a5c; --done-tint: #e3f1e8; --shade: rgb(20 32 40 / .08);
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d151a; --card: #151f26; --ink: #e6edf0; --soft: #98a8b1; --line: #243139;
    --river: #78c1e0; --river-tint: #17303c; --next: #e8ad5e; --next-tint: #30251a;
    --done: #79c796; --done-tint: #18301f; --shade: rgb(0 0 0 / .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d151a; --card: #151f26; --ink: #e6edf0; --soft: #98a8b1; --line: #243139;
  --river: #78c1e0; --river-tint: #17303c; --next: #e8ad5e; --next-tint: #30251a;
  --done: #79c796; --done-tint: #18301f; --shade: rgb(0 0 0 / .35); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 108px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--river); }
a:focus-visible, button:focus-visible, .rail:focus-visible { outline: 2px solid var(--river); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3, h4, p { margin: 0; }
h2 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
h3, h4 { font-weight: 700; text-wrap: balance; line-height: 1.3; }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px 4px; }
.mark { font-weight: 800; font-size: 18px; white-space: nowrap; }
.mark small { font-weight: 500; font-size: 13px; color: var(--soft); margin-left: 8px; }
.themebtn { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--soft); cursor: pointer; }
.themebtn:hover { background: var(--river-tint); color: var(--river); }
.themebtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs a { flex: none; padding: 8px 12px 10px; font-size: 14.5px; font-weight: 700; color: var(--soft); border-bottom: 2.5px solid transparent; }
.tabs a.on { color: var(--ink); border-bottom-color: var(--river); }

section.part { padding-block: 26px 4px; }
.head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 14px; }
.head .n, .n { font-size: 13px; font-weight: 600; color: var(--soft); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.kind { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); }
.meta { font-size: 13px; color: var(--soft); }
.meta b { color: var(--river); font-weight: 700; }
.what { font-size: 14px; }
.why { font-size: 13.5px; color: var(--soft); font-style: italic; }

/* images */
.cover, .thumb { display: block; overflow: hidden; background: var(--river-tint); border-radius: 10px; flex: none; max-width: 100%; }
.cover img, .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.cover.poster { aspect-ratio: 2 / 3; } .cover.square { aspect-ratio: 1; } .cover.wide { aspect-ratio: 16 / 9; }
.ph { display: grid; place-items: center; width: 100%; height: 100%; font-size: 28px; background: linear-gradient(160deg, var(--river-tint), var(--next-tint)); }

/* pick back up */
.picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.pick { background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--river); border-radius: var(--r); padding: 14px; display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; align-items: start; min-width: 0; }
.pick .cover.wide, .pick .cover.square { aspect-ratio: 1; }
.pick .body { display: grid; gap: 5px; min-width: 0; }
.pick h3 { font-size: 18px; }
.row { display: flex; align-items: center; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
.open { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; padding: 8px 14px; border-radius: 999px; background: var(--river); color: var(--card); }
.open:hover { color: var(--card); filter: brightness(1.08); }
@media (max-width: 880px) { .picks { grid-template-columns: minmax(0, 1fr); } }

/* rhythm card */
.rhythm { border-top: 3px solid var(--next); background: linear-gradient(var(--next-tint), var(--card) 90px); }
.rlabel { font-size: 12.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--next); }
.rline { font-size: 14px; color: var(--soft); margin: 2px 0 10px; }
.moods { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 4px 22px; }
.mood h3 { font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--next); margin: 6px 0 2px; }

/* watch and rows */
.wl { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.wcol { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.wcol > h3 { font-size: 15.5px; }
.gwhy { font-size: 12.5px; color: var(--soft); margin-bottom: 4px; }
.w { display: grid; grid-template-columns: auto minmax(0, 1fr) 34px; gap: 0 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.wcol > h3 + .w, .gwhy + .w, .mood h3 + .w { border-top: 0; }
.w .thumb { width: 54px; height: 76px; }
.w .thumb.wide { width: 96px; height: 54px; } .w .thumb.square { width: 64px; height: 64px; }
.w h4 { font-size: 15.5px; }
.w .body { display: grid; gap: 1px; min-width: 0; }

/* shelves, one per app */
.shelf { margin-bottom: 18px; }
.shelf > header { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 8px; }
.shelf > header h3 { font-size: 16.5px; }
.glyph { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--ink); color: var(--card); }
.note { font-size: 12.5px; color: var(--soft); flex-basis: 100%; }
.rail { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 10px; scroll-snap-type: x proximity; scrollbar-width: thin; }
.tile { position: relative; flex: none; width: 138px; display: grid; gap: 6px; align-content: start; scroll-snap-align: start; }
.tile.wide { width: 220px; } .tile.square { width: 156px; }
.tile .cover { box-shadow: 0 2px 10px var(--shade); }
.tile h4 { font-size: 14px; }
.tile .meta { font-size: 12.5px; }
.tile .act { position: absolute; top: 6px; right: 6px; background: color-mix(in srgb, var(--card) 88%, transparent); }

/* marks */
.act { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--soft); font: inherit; font-size: 18px; line-height: 1; cursor: pointer; display: grid; place-items: center; flex: none; }
.act:hover { color: var(--river); border-color: var(--river); }
.act.has { background: var(--river-tint); color: var(--river); border-color: transparent; font-size: 14px; font-weight: 800; }
.act.fin { background: var(--done-tint); color: var(--done); } .act.drp { background: var(--line); color: var(--soft); }
.badge { display: inline-block; justify-self: start; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--river-tint); color: var(--river); }
.badge.fin { background: var(--done-tint); color: var(--done); } .badge.drp { background: var(--line); color: var(--soft); }
.thought { font-size: 13px; color: var(--soft); font-style: italic; border-left: 2px solid var(--river); padding-left: 8px; }
.is-fin h3, .is-fin h4 { opacity: .6; } .is-drp h3, .is-drp h4 { opacity: .5; text-decoration: line-through; }
.is-fin .cover img, .is-drp .cover img, .is-drp .thumb img { filter: grayscale(.7); opacity: .7; }

.donecard { border-top: 3px solid var(--done); }
.empty { font-size: 14px; color: var(--soft); }
#doneList .w { grid-template-columns: auto minmax(0, 1fr); }
.tell { margin-top: 14px; }
.tell textarea, .sheet textarea { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; }
.tell textarea { min-height: 70px; margin-top: 8px; }
footer { padding-block: 26px 44px; font-size: 12.5px; color: var(--soft); }

/* the sheet */
.sheet-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 50; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--card); border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgb(0 0 0 / .18); padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); max-width: 640px; margin: 0 auto; max-height: 88vh; overflow: auto; }
.sheet h3 { font-size: 18px; margin: 2px 0 12px; padding-right: 36px; }
.sheet .x { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: var(--soft); font-size: 22px; cursor: pointer; }
.st { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.st button { font: inherit; font-size: 16px; font-weight: 700; padding: 14px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.st button[aria-pressed="true"] { background: var(--river); color: var(--card); border-color: var(--river); }
.st button[data-s="finished"][aria-pressed="true"] { background: var(--done); border-color: var(--done); }
.st button[data-s="dropped"][aria-pressed="true"] { background: var(--soft); border-color: var(--soft); }
.sheet label { display: block; font-size: 12.5px; font-weight: 700; color: var(--soft); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .06em; }
.sheet textarea { min-height: 96px; }
.row2 { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
.btn { font: inherit; font-weight: 800; font-size: 15px; padding: 10px 18px; border-radius: 12px; border: 0; background: var(--river); color: var(--card); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--river); border: 1px solid var(--line); }
.mic.on { background: var(--next); color: var(--card); border-color: var(--next); }
.saved { font-size: 13px; color: var(--done); font-weight: 700; }

@media (max-width: 640px) {
  body { font-size: 17px; }
  .pick { grid-template-columns: 96px minmax(0, 1fr); }
  .pick h3 { font-size: 19px; } .w h4 { font-size: 17px; } .what { font-size: 15px; } .meta, .why { font-size: 14px; }
  .act { width: 44px; height: 44px; font-size: 22px; }
  .w { grid-template-columns: auto minmax(0, 1fr) 44px; } .w .thumb { width: 58px; height: 82px; } .w .thumb.wide { width: 92px; height: 52px; }
  .tile { width: 132px; } .tile .act { width: 38px; height: 38px; }
  .tabs a { font-size: 16px; padding: 10px 14px 12px; }
  .sheet h3 { font-size: 20px; } .btn { font-size: 17px; padding: 13px 22px; }
}
@media (max-width: 480px) { .mark small { display: none; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="mark">Stories <small>{{WEEK}} · {{DATES}}</small></div>
      <button id="themeBtn" class="themebtn" type="button" aria-label="Switch to dark mode"></button>
    </div>
    <nav class="tabs" aria-label="Sections">{{NAV}}</nav>
  </div>
</header>

<main class="wrap">
{{MAIN}}
  <div class="card tell" id="tell" hidden>
    <span class="kind">Tell the Stories page</span>
    <p class="meta">Something to add, a show someone mentioned, more of this or less of that. Claude reads it before next week’s page.</p>
    <textarea id="tellTx" aria-label="Note for next week’s page"></textarea>
    <div class="row2"><button class="btn" id="tellGo" type="button">Send</button><span class="saved" id="tellOk"></span></div>
  </div>
  <footer>{{FOOT}}</footer>
</main>

<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden>
  <button class="x" id="shX" type="button" aria-label="Close">×</button>
  <div class="kind" id="shKind"></div>
  <h3 id="shTitle"></h3>
  <div class="st" id="shSt">
    <button type="button" data-s="started" aria-pressed="false">◐ Started</button>
    <button type="button" data-s="finished" aria-pressed="false">✓ Finished</button>
    <button type="button" data-s="dropped" aria-pressed="false">✕ Dropped</button>
  </div>
  <label for="shNote">A thought <span style="text-transform:none;letter-spacing:0;font-weight:500">(optional)</span></label>
  <textarea id="shNote" placeholder="What stayed with you, where you left off, who you’d tell…"></textarea>
  <div class="row2"><button class="btn" id="shSave" type="button">Save</button><button class="btn ghost mic" id="shMic" type="button" hidden>🎙 Speak</button><span class="saved" id="shSaved"></span></div>
</div>

<script>
(function () {
  // theme toggle
  var root = document.documentElement, btn = document.getElementById('themeBtn');
  var SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  function dark() { var t = root.getAttribute('data-theme'); return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
  function drawBtn() { btn.innerHTML = dark() ? SUN : MOON; btn.setAttribute('aria-label', dark() ? 'Switch to light mode' : 'Switch to dark mode'); }
  try { var saved = localStorage.getItem('stories-theme'); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
  drawBtn();
  btn.addEventListener('click', function () { var t = dark() ? 'light' : 'dark'; root.setAttribute('data-theme', t); try { localStorage.setItem('stories-theme', t); } catch (e) {} drawBtn(); });

  // today's rhythm: the day type decides which card shows
  var now = new Date(), wd = now.getDay();
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var type = wd === 0 ? 'sun' : wd === 6 ? 'sat' : 'weekday';
  var shown = document.querySelector('.rday[data-days="' + type + '"]') || document.querySelector('.rday[data-days="weekday"]');
  if (shown) { shown.hidden = false; shown.querySelector('.dname').textContent = DAYS[wd]; }
  else { var t = document.getElementById('today'); if (t) t.hidden = true; }

  // tabs follow the scroll
  var tabs = [].slice.call(document.querySelectorAll('.tabs a'));
  function onScroll() {
    var y = window.scrollY + 130, on = tabs[0];
    tabs.forEach(function (a) { var s = document.querySelector(a.getAttribute('href')); if (s && !s.hidden && s.offsetTop <= y) on = a; });
    tabs.forEach(function (a) { a.classList.toggle('on', a === on); });
  }
  addEventListener('scroll', onScroll, { passive: true }); onScroll();

  // the live layer: what she starts, finishes, drops and thinks, kept in the page's db for Claude
  var db = null, items = {}, cur = null, dict = null, today = new Date().toLocaleDateString('en-CA');
  var LABEL = { started: '◐ Started', finished: '✓ Finished', dropped: '✕ Dropped' };
  var CLS = { started: '', finished: 'fin', dropped: 'drp' };
  function hosts() { return document.querySelectorAll('[data-k]'); }
  function hostOf(k) { return document.querySelector('[data-k="' + k + '"]'); }
  function paint() {
    hosts().forEach(function (h) {
      var d = items[h.dataset.k], b = h.querySelector('.act'), body = h.querySelector('.body') || h;
      body.querySelectorAll('.live-x').forEach(function (n) { n.remove(); });
      h.classList.remove('is-fin', 'is-drp');
      if (!b) return;
      b.className = 'act';
      if (!d || (!d.status && !d.note)) { b.textContent = '+'; return; }
      b.classList.add('has'); if (CLS[d.status]) b.classList.add(CLS[d.status]);
      b.textContent = d.status === 'finished' ? '✓' : d.status === 'dropped' ? '✕' : d.status === 'started' ? '◐' : '•';
      if (d.status === 'finished') h.classList.add('is-fin'); if (d.status === 'dropped') h.classList.add('is-drp');
      if (d.status) { var s = document.createElement('span'); s.className = 'badge live-x ' + (CLS[d.status] || ''); s.textContent = LABEL[d.status] + (d.statusDay === today ? ' today' : ''); body.appendChild(s); }
      if (d.note && !h.classList.contains('tile')) { var p = document.createElement('p'); p.className = 'thought live-x'; p.textContent = '“' + d.note.slice(0, 160) + (d.note.length > 160 ? '…' : '') + '”'; body.appendChild(p); }
    });
    doneList();
  }
  function doneList() {
    var box = document.getElementById('doneList'), n = document.getElementById('doneN'); if (!box) return;
    var list = Object.keys(items).map(function (k) { return Object.assign({ k: k }, items[k]); })
      .filter(function (d) { return d.status || d.note; })
      .sort(function (a, b) { return (b.updated || '').localeCompare(a.updated || ''); });
    n.textContent = list.length ? String(list.length) : '';
    if (!list.length) return;
    box.textContent = '';
    list.forEach(function (d) {
      var src = hostOf(d.k), row = document.createElement('div'); row.className = 'w';
      var img = src && src.querySelector('img');
      row.innerHTML = '<span class="thumb"></span><div class="body"><a><h4></h4></a><p class="meta"></p></div>';
      if (img) { var i2 = document.createElement('img'); i2.src = img.getAttribute('src'); i2.alt = ''; row.querySelector('.thumb').appendChild(i2); }
      var a = row.querySelector('a'); a.href = (src && src.querySelector('a[href]') || {}).href || '#'; a.querySelector('h4').textContent = d.title || d.k;
      row.querySelector('.meta').textContent = (LABEL[d.status] || 'A thought') + (d.statusDay ? ' · ' + d.statusDay.slice(5).replace('-', '/') : '');
      if (d.note) { var t = document.createElement('p'); t.className = 'thought'; t.textContent = '“' + d.note + '”'; row.querySelector('.body').appendChild(t); }
      box.appendChild(row);
    });
  }

  var sheet = document.getElementById('sheet'), bg = document.getElementById('sheetBg');
  function open(h) {
    cur = h; var d = items[h.dataset.k] || {};
    document.getElementById('shTitle').textContent = h.dataset.t; document.getElementById('shKind').textContent = h.dataset.kind || '';
    sheet.querySelectorAll('#shSt button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.s === d.status)); });
    document.getElementById('shNote').value = d.note || ''; document.getElementById('shSaved').textContent = db ? '' : 'Marks save once the page connects.';
    sheet.hidden = false; bg.hidden = false; sheet.querySelector('#shSt button').focus();
  }
  function close() { sheet.hidden = true; bg.hidden = true; if (dict) dict.stop().catch(function () {}); var h = cur; cur = null; if (h && h.querySelector('.act')) h.querySelector('.act').focus(); }
  bg.addEventListener('click', close); document.getElementById('shX').addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && cur) close(); });
  sheet.querySelectorAll('#shSt button').forEach(function (b) {
    b.addEventListener('click', function () {
      var on = b.getAttribute('aria-pressed') !== 'true';
      sheet.querySelectorAll('#shSt button').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', String(on)); save(false);
    });
  });
  document.getElementById('shSave').addEventListener('click', function () { save(true); });
  var saving = Promise.resolve();
  function save(closeAfter) {
    if (!cur) return;
    if (!db) { document.getElementById('shSaved').textContent = 'Not connected, so this can’t be saved. Reopen the page and try again.'; return; }
    var h = cur, k = h.dataset.k, prev = items[k] || {}, nowIso = new Date().toISOString();
    var sb = sheet.querySelector('#shSt button[aria-pressed="true"]'), note = document.getElementById('shNote').value.trim();
    var d = Object.assign({}, prev, { title: h.dataset.t, kind: h.dataset.kind || '', updated: nowIso, status: sb ? sb.dataset.s : null, note: note });
    if (d.status !== prev.status) d.statusDay = today; if (note !== (prev.note || '')) d.noteDay = today;
    items[k] = d; paint();
    saving = saving.then(function () { return db.doc('items/' + k).set(d); })
      .then(function () { document.getElementById('shSaved').textContent = 'Saved ✓'; if (closeAfter) setTimeout(close, 350); })
      .catch(function () { document.getElementById('shSaved').textContent = 'That didn’t save. Try again.'; });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('.act'); if (b) { e.preventDefault(); var h = b.closest('[data-k]'); if (h) open(h); return; }
    var a = e.target.closest('main a[href]'); if (!a || !db) return;
    var h2 = a.closest('[data-k]');
    db.collection('clicks').add({ url: a.href, k: h2 ? h2.dataset.k : null, title: h2 ? h2.dataset.t : a.textContent.trim().slice(0, 120), at: new Date().toISOString(), day: today }).catch(function () {});
  }, true);

  document.getElementById('tellGo').addEventListener('click', function () {
    var v = document.getElementById('tellTx').value.trim(); if (!v || !db) return;
    db.collection('feedback').add({ text: v, at: new Date().toISOString(), day: today })
      .then(function () { document.getElementById('tellTx').value = ''; document.getElementById('tellOk').textContent = 'Sent ✓'; })
      .catch(function () { document.getElementById('tellOk').textContent = 'That didn’t send. Try again.'; });
  });

  if (window.claude && claude.use) {
    claude.use('db').then(function (x) {
      if (!x) return; db = x; document.getElementById('tell').hidden = false;
      var timer = setTimeout(function () {}, 10000);
      db.collection('items').onSnapshot(function (s) {
        clearTimeout(timer); var o = {};
        s.docs.forEach(function (d) { o[d.id] = d.data(); });
        if (cur && items[cur.dataset.k]) o[cur.dataset.k] = items[cur.dataset.k];
        items = o; paint();
      }, function () { clearTimeout(timer); });
    });
    claude.use('dictation').then(function (d) {
      if (!d) return; dict = d; var mic = document.getElementById('shMic'), ta = document.getElementById('shNote'), base = '';
      mic.hidden = false;
      d.onPartial(function (p) { ta.value = base + (base && !/\s$/.test(base) ? ' ' : '') + p.text; });
      d.onFinal(function (p) { base = base + (base && !/\s$/.test(base) ? ' ' : '') + p.text; ta.value = base; });
      d.onState(function (s) { var on = s.state === 'listening'; mic.classList.toggle('on', on); mic.textContent = on ? '■ Stop' : '🎙 Speak'; });
      mic.addEventListener('click', function () {
        if (mic.classList.contains('on')) { d.stop().catch(function () {}); return; }
        base = ta.value; d.start().catch(function (e) { if (e && e.code === 'not_granted') mic.hidden = true; });
      });
    });
  }
})();
</script>
