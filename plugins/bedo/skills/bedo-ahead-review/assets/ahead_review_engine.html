<title>Monthly Ahead-Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght%409..144,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* layout: one card per screen, swipe left/right; glyph row pinned near the thumb; forest green ground, moss, clay, ochre */
:root{
  --bg:#15211A; --card:#1F2E25; --raised:#2A3C31; --ink:#EEF2E7; --mute:#B4C3B0; --line:#3B4F42;
  --moss:#9CC47A; --clay:#D07A52; --ochre:#D9A94E; --on-accent:#1B1712;
  --display:"Fraunces",Georgia,serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:17px/1.45 var(--body);padding-inline:14px;padding-block:0;margin:0}
.app{height:var(--vh,100%);max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-block:10px 12px;min-width:0}
.top{display:grid;gap:6px;flex:none}
.top .row1{display:flex;align-items:center;gap:8px;min-width:0}
select{flex:1;min-width:0;font:700 .95rem var(--body);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.count{font-size:.85rem;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--moss)}
.stage{flex:1;min-height:0;margin-top:10px;overflow-y:auto;touch-action:pan-y}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:transform .18s ease,opacity .18s ease}
.card.set{border-color:var(--moss)}
.body{display:grid;gap:10px;align-content:start}
.drive{font-size:.8rem;color:var(--ochre);font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.t{font:600 1.3rem/1.25 var(--display);overflow-wrap:anywhere}
.her{font-size:1rem;opacity:.9;overflow-wrap:anywhere}
.why{font-size:.95rem;color:var(--mute);overflow-wrap:anywhere}
.why b{color:var(--moss)}
.state{font-size:.95rem;font-weight:700;min-height:1.4em}
.state.none{font-weight:400;color:var(--mute)}
.g{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;flex:none}
.g button{min-height:58px;min-width:0;border-radius:12px;border:1px solid var(--line);background:var(--raised);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:4px 0;font:700 .7rem/1.1 var(--body)}
.g button .e{font-size:1.4rem;line-height:1.15}
.g button span:last-child{white-space:nowrap}
.g button.sug{border:2px dashed var(--moss)}
.g button[aria-pressed="true"]{background:var(--moss);border:2px solid var(--moss);color:var(--on-accent)}
.g button[aria-pressed="true"].dr{background:var(--clay);border-color:var(--clay)}
input,textarea{font:inherit;font-size:16px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--ink);padding:10px;width:100%;min-width:0}
.nav{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;flex:none;margin-top:10px}
.nav button{font:700 .95rem var(--body);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:46px;cursor:pointer}
.nav .hint{font-size:.8rem;color:var(--mute);text-align:center}
.notice{font-size:.85rem;background:var(--raised);border-radius:10px;padding:8px 10px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
textarea.note{flex:none;min-height:72px;resize:none;line-height:1.35}
body.typing .her,body.typing .why,body.typing .drive,body.typing .nav,body.typing .top,body.typing .state,body.typing .dlab{display:none}
body.typing .t{font-size:1.05rem}
body.typing .stage{margin-top:0}
body.typing .card{gap:8px;padding:12px}
body.typing .body{flex:none}
.save{min-height:52px;border-radius:12px;border:0;background:var(--moss);color:var(--on-accent);font:700 1.05rem var(--body);cursor:pointer}
.save:disabled{opacity:.45}
.saved{font-size:.85rem;color:var(--moss);font-weight:700;text-align:center}
.dlab{font-size:.85rem;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
<div class="app">
  <div class="top">
    <div class="row1"><select id="jump" aria-label="Jump to drive"></select><span class="count" id="count"></span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="notice" id="note" hidden></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="nav">
    <button type="button" id="prev">‹ Back</button>
    <span class="hint">swipe</span>
    <button type="button" id="next">Next ›</button>
  </div>
</div>
<script>
const ITEMS = __ITEMS__;
const G=[["done","✅","done"],["motion","▶️","in motion"],["intention","⬜","intention"],["potential","▫️","potential"],["dropped","✖️","dropped"]];
const SAY={potential:"▫️ potential",intention:"⬜ intention",motion:"▶️ in motion",done:"✅ done",dropped:"✖️ dropped"};
const STAT={"▫️":"potential","⬜":"intention","▶️":"motion"};
function curStat(i){return STAT[(i.s||"").slice(0,2)]||STAT[(i.s||"").slice(0,1)]||"potential"}
const RECMAP={done:"done",drop:"dropped",someday:"potential",date:"intention"};
function recOf(i){ if(i.r==="keep")return curStat(i); return RECMAP[i.r]||"" }
const OLD={done:"done",drop:"dropped",someday:"potential",date:"intention",cal:"intention"};
let A={}, db=null, idx=0, timer=null;
function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function choice(a,i){ if(!a||!a.c)return ""; if(a.c==="ok")return recOf(i); if(a.c==="keep")return curStat(i); return OLD[a.c]||a.c }
function answered(a,i){return !!choice(a,i)||!!(a&&(a.reply||"").trim())}
function showNote(t){const n=document.getElementById("note");n.textContent=t;n.hidden=!t}
async function save(k,data){
  const empty=!data.c&&!(data.note||"").trim();
  if(empty)delete A[k];else A[k]={...data,at:Date.now()};
  if(!db)return;
  try{ empty? await db.doc("answers/"+k).delete() : await db.doc("answers/"+k).set(A[k]) }
  catch(e){showNote("That didn't save. Try again in a moment.")}
}
const drives=[...new Set(ITEMS.map(i=>i.d))];
function fillJump(){
  const s=document.getElementById("jump");const cur=ITEMS[idx].d;s.textContent="";
  drives.forEach(d=>{const L=ITEMS.filter(i=>i.d===d);const n=L.filter(i=>answered(A[i.k],i)).length;
    const o=el("option","",d+"  ·  "+n+"/"+L.length);o.value=d;if(d===cur)o.selected=true;s.append(o)});
}
function header(){
  const n=ITEMS.filter(i=>answered(A[i.k],i)).length;
  document.getElementById("prog").style.width=(100*n/ITEMS.length)+"%";
  document.getElementById("count").textContent=(idx+1)+" / "+ITEMS.length;
  fillJump();
}
let draft=null;
function show(dir){
  const i=ITEMS[idx], a=A[i.k]||{};
  if(!draft||draft.k!==i.k) draft={k:i.k,c:choice(a,i),date:a.date||"",note:a.note||a.reply||""};
  const st=document.getElementById("stage");
  const c=el("div","card"+(answered(a,i)?" set":""));
  const b=el("div","body");
  b.append(el("div","drive",i.d),el("div","t",i.t));
  b.append(el("div","why","Now: "+i.s+(i.tg?" · target "+i.tg:"")));
  if(i.h)b.append(el("div","her",i.h));
  const w=el("div","why");w.append(el("b","","be•do: "),document.createTextNode(i.w));b.append(w);
  c.append(b);
  const rec=recOf(i);
  const g=el("div","g");
  const btns={};
  G.forEach(([v,e,l])=>{const bt=el("button",(v===rec?"sug ":"")+(v==="dropped"?"dr":""));bt.type="button";
    bt.setAttribute("aria-label",SAY[v]);bt.append(el("span","e",e),el("span","",l));
    bt.onclick=()=>{draft.c=draft.c===v?"":v;paint()};btns[v]=bt;g.append(bt)});
  c.append(g);
  const n=document.createElement("textarea");n.id="n_"+i.k;n.className="note";n.placeholder="Note (optional)";n.value=draft.note;n.setAttribute("aria-label","Note");
  n.onfocus=()=>{document.body.classList.add("typing");fit();setTimeout(()=>c.scrollIntoView({block:"start"}),50)};
  n.onblur=()=>{setTimeout(()=>{if(document.activeElement!==n){document.body.classList.remove("typing");fit()}},150)};
  n.oninput=()=>{draft.note=n.value;paint()};
  c.append(n);
  const sv=el("button","save","");sv.type="button";
  const msg=el("div","saved",answered(a,i)?"Saved":"");
  sv.onmousedown=e=>e.preventDefault();
  sv.onclick=async()=>{
    sv.disabled=true;
    await save(i.k,{c:draft.c,date:"",note:draft.note});
    document.activeElement&&document.activeElement.blur();document.body.classList.remove("typing");fit();
    header();msg.textContent="Saved";
    setTimeout(()=>{draft=null;go(1)},350);
  };
  c.append(sv,msg);
  function paint(){
    G.forEach(([v])=>btns[v].setAttribute("aria-pressed",draft.c===v?"true":"false"));
    n.placeholder=draft.c==="intention"?"When is the right time, and why? (your words — no date needed)":"Note (optional)";
    sv.disabled=!draft.c&&!draft.note.trim();
    sv.textContent=draft.c?("Save "+SAY[draft.c]+" ›"):(draft.note.trim()?"Save note ›":"Pick a status");
  }
  paint();
  if(dir){c.style.transform="translateX("+(dir*40)+"px)";c.style.opacity="0";requestAnimationFrame(()=>{c.style.transform="";c.style.opacity="1"})}
  st.textContent="";st.append(c);st.scrollTop=0;
}
function auto(){clearTimeout(timer);timer=setTimeout(()=>go(1),550)}
function go(d){clearTimeout(timer);draft=null;const j=idx+d;if(j<0||j>=ITEMS.length)return;idx=j;header();show(d)}
document.getElementById("prev").onclick=()=>go(-1);
document.getElementById("next").onclick=()=>go(1);
document.getElementById("jump").onchange=e=>{const d=e.target.value;const L=ITEMS.map((x,k)=>[x,k]).filter(([x])=>x.d===d);
  const f=L.find(([x])=>!answered(A[x.k],x))||L[0];idx=f[1];header();show(1)};
let sx=null,sy=null;
const stage=document.getElementById("stage");
stage.addEventListener("touchstart",e=>{if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
stage.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)go(dx<0?1:-1)},{passive:true});
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
function fit(){const v=window.visualViewport;const h=v?v.height:window.innerHeight;document.documentElement.style.setProperty("--vh",h+"px");window.scrollTo(0,0)}
if(window.visualViewport){visualViewport.addEventListener("resize",fit);visualViewport.addEventListener("scroll",()=>window.scrollTo(0,0))}
window.addEventListener("resize",fit);fit();
function start(){const f=ITEMS.findIndex(i=>!answered(A[i.k],i));idx=f<0?0:f;header();show(0)}
start();
(async()=>{
  try{db=window.claude?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){showNote("Answers aren't saving in this view. Open it signed in to claude.ai.");return}
  let first=true;
  db.collection("answers").onSnapshot(q=>{const m={};q.docs.forEach(d=>{m[d.id]=d.data()});A=m;
    if(first){first=false;start();return}
    header()});
})();
</script>
