<title>/*TITLE*/</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a quest log for the child — the score as a treasure count up top, the day's big win as a trophy photo,
   five realms of two quests each, then the week line. Written to the child, never about him. */
:root{
  --bg:#eef3f7; --panel:#ffffff; --ink:#1d2a3a; --muted:#5b6b7d;
  --gold:#d99a1e; --gold-soft:#fbefd2; --win:#2f8f5b; --win-soft:#dff2e7; --next:#8a94a3; --next-soft:#eceff3;
  --display:"Bungee","Arial Black",Impact,sans-serif; --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a24; --panel:#1b2532; --ink:#eaf0f6; --muted:#9fb0c2;
  --gold:#f2b63c; --gold-soft:#3a2f17; --win:#5cc98c; --win-soft:#173326; --next:#8f9aab; --next-soft:#232d3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a24; --panel:#1b2532; --ink:#eaf0f6; --muted:#9fb0c2;
  --gold:#f2b63c; --gold-soft:#3a2f17; --win:#5cc98c; --win-soft:#173326; --next:#8f9aab; --next-soft:#232d3a; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,8vw,40px);line-height:1.05;margin:0;text-wrap:balance}
.day{font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--muted);margin:0}
.score{background:var(--gold-soft);border:3px solid var(--gold);border-radius:18px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.coins{font-family:var(--display);font-size:56px;line-height:1;color:var(--gold)}
.coins small{font-size:22px;color:var(--ink)}
.score p{margin:0;font-weight:700}
.money{font-family:var(--display);font-size:26px;display:block;margin-top:2px}
.pips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pip{width:20px;height:20px;border-radius:50%;background:var(--next-soft);border:2px solid var(--next)}
.pip.on{background:var(--gold);border-color:var(--gold)}
.trophy{background:var(--panel);border-radius:18px;overflow:hidden;display:grid;margin:0}
.trophy img{width:100%;max-height:360px;object-fit:cover;display:block}
.trophy p{margin:0;padding:12px 16px 14px;font-weight:700}
.realms{display:flex;flex-direction:column;gap:12px}
.realm{background:var(--panel);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.realm h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0;letter-spacing:.02em}
.q{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:12px}
.q.won{background:var(--win-soft)}
.q.next{background:var(--next-soft)}
.mark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff}
.won .mark{background:var(--win)}
.next .mark{background:var(--next)}
.q b{display:block}
.q span{color:var(--muted);font-size:15px}
.snap{margin:0}
.snap img{width:100%;max-height:300px;object-fit:cover;border-radius:12px;display:block}
.foot{color:var(--muted);font-size:15px;margin:0;text-align:center}
</style>
<div class="wrap" id="page"></div>
<script id="quest" type="application/json">/*DATA*/</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('quest').textContent);
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var won = 0; D.realms.forEach(function(r){ r.quests.forEach(function(q){ if (q.won) won++; }); });
  var pips = ''; for (var i = 0; i < 10; i++) pips += '<i class="pip' + (i < won ? ' on' : '') + '"></i>';
  var money = (won * (D.per_point || 0.5)).toFixed(2);
  var h = '<p class="day">' + esc(D.day) + '</p><h1>' + esc(D.name) + "'s Quest</h1>";
  h += '<section class="score" aria-label="Today\'s score"><div class="coins">' + won + '<small>/10</small></div><div><p>You earned ' + won +
       ' out of 10 today.<span class="money">That\'s $' + money + '</span></p><div class="pips" aria-hidden="true">' + pips + '</div></div></section>';
  if (D.trophy) h += '<figure class="trophy">' + (D.trophy.img ? '<img src="' + D.trophy.img + '" alt="' + esc(D.trophy.alt) + '">' : '') + '<p>' + esc(D.trophy.text) + '</p></figure>';
  h += '<div class="realms">';
  D.realms.forEach(function(r){
    h += '<section class="realm"><h2>' + esc(r.name) + '</h2>';
    r.quests.forEach(function(q){
      h += '<div class="q ' + (q.won ? 'won' : 'next') + '"><div class="mark">' + (q.won ? '✓' : '·') + '</div><div><b>' + esc(q.name) + '</b><span>' + esc(q.line) + '</span></div></div>';
      if (q.img) h += '<figure class="snap"><img src="' + q.img + '" alt="' + esc(q.alt) + '"></figure>';
    });
    h += '</section>';
  });
  h += '</div>';
  if (D.foot) h += '<p class="foot">' + esc(D.foot) + '</p>';
  document.getElementById('page').innerHTML = h;
})();
</script>
